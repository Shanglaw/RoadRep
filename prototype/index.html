  /* ---------- View: Moderation (§7.2 / §14.4 der Spec) ---------- */
  // state.currentUser.isModerator kommt aus bootstrapState() (SELECT gegen moderators, RLS erlaubt jedem
  // eingeloggten Konto nur das Lesen der eigenen Mitgliedschaft nicht - moderators_select_authenticated
  // lässt jeden Login alle Zeilen sehen, aber Client zeigt hier trotzdem nur den eigenen Status an). Die
  // eigentliche Schutzgrenze ist serverseitig: is_moderator() in den plates_select_moderator/
  // moderation_cases_select_moderator/apply_moderation_decision()-Prüfungen (0003_rls.sql,
  // 0004_functions.sql). Diese Ansicht hier ist nur eine frühzeitige, informative Absage, keine eigene
  // Schutzschicht - ein manipulierter Client käme trotzdem nicht an echte Moderationsdaten heran.
  function viewModerationDenied(){
    return '<div class="stack">' +
      '<h1>Moderation</h1>' +
      '<div class="callout warn">Dieser Bereich ist nur für Mitarbeiter:innen mit Moderationsrechten zugänglich.</div>' +
      '<a class="btn btn-secondary" href="#/search">Zur Suche</a>' +
    '</div>';

  function viewModeration(caseId){
    if (caseId) return viewModerationCase(caseId);

    var cache = ensureModerationCasesLoaded();
    if (!cache.loaded) {
      return '<div class="stack"><h1>Moderation</h1><div class="card stack"><p style="color:var(--ink-muted)">Lade Fälle …</p></div></div>';
    }

    // Eskalierte offene Fälle zuerst, dann übrige offene, geschlossene (dismissed) zuletzt — innerhalb
    // jeder Gruppe neueste zuerst. Macht "Eskalieren" zu einer echten Priorisierung in der Liste, statt
    // nur ein Label zu ändern.
    function caseSortRank(c){
      if (c.status !== "dismissed" && c.escalated) return 0;
      if (c.status !== "dismissed") return 1;
      return 2;
    }
    var cases = cache.list.slice().sort(function(a,b){
      var ra = caseSortRank(a), rb = caseSortRank(b);
      return ra !== rb ? ra - rb : new Date(b.created_at) - new Date(a.created_at);
    });
    var rows = cases.length ? cases.map(function(c){
      var plate = c.plates || {};
      var statusChip = c.status==="dismissed"
        ? '<span class="chip chip-muted">Geschlossen</span>'
        : (c.escalated ? '<span class="chip chip-severe">Eskaliert</span>' : '<span class="chip chip-negative">Offen</span>');
      var hiddenNote = (plate.moderation_blocked ? ' <span class="chip chip-negative">Gesperrt</span>' : "") +
        (plate.moderation_hidden ? ' <span class="chip chip-muted">Verborgen</span>' : "");
      return '<a href="#/moderation/'+encodeURIComponent(c.id)+'" class="row" style="justify-content:space-between; align-items:center; flex-wrap:wrap; gap:var(--sp-3); padding:var(--sp-3) 0; border-bottom:1px solid var(--border); text-decoration:none; color:inherit;">' +
        '<span class="row" style="gap:var(--sp-3); align-items:center; flex-wrap:wrap;">' +
          '<span class="tabular" style="font-weight:700;">'+esc(c.case_number)+'</span>' +
          plateChip(plate.display_plate || "?", null, plate.country_code || "DE") +
          '<span style="color:var(--ink-muted); font-size:var(--fs-sm);">'+esc(c.reason)+'</span>' +
        '</span>' +
        '<span class="row" style="gap:var(--sp-2);">'+statusChip+hiddenNote+'</span>' +
      '</a>';
    }).join("") : '<p style="color:var(--ink-faint); margin:0;">Keine Meldungen vorhanden.</p>';

    return '<div class="stack">' +
      '<div class="row" style="justify-content:space-between; align-items:center; flex-wrap:wrap; gap:var(--sp-3);">' +
        '<h1>Moderation</h1>' +
        '<button class="btn btn-ghost btn-sm" id="btn-mod-refresh">Aktualisieren</button>' +
      '</div>' +
      '<div class="callout">Eskalierte offene Fälle stehen oben in der Liste.</div>' +
      '<div class="card stack">'+rows+'</div>' +
    '</div>';
  }

  function viewModerationCase(caseId){
    var cache = ensureModerationCasesLoaded();
    if (!cache.loaded) {
      return '<div class="stack"><h1>Moderation</h1><div class="card stack"><p style="color:var(--ink-muted)">Lade …</p></div></div>';
    }
    var c = cache.list.filter(function(x){ return x.id === caseId; })[0];
    if (!c) {
      return '<div class="stack"><h1>Fall nicht gefunden</h1>' +
        '<div class="callout warn">Fallnummer „'+esc(caseId)+'“ existiert nicht (mehr) oder wurde nicht geladen.</div>' +
        '<a class="btn btn-secondary" href="#/moderation">Zurück zur Fallliste</a></div>';
    }
    var plate = c.plates || {};
    var hidden = !!plate.moderation_hidden;
    var blocked = !!plate.moderation_blocked;
    var closed = c.status === "dismissed";

    var decisions = ensureModerationDecisionsLoaded(caseId);
    var decisionsHtml = !decisions.loaded
      ? '<p style="color:var(--ink-muted); margin:0;">Lade …</p>'
      : (decisions.list.length ? decisions.list.map(function(d){
          var who = d.actor_user_id === state.currentUser.id ? "Du" : (d.actor_user_id.slice(0,8)+"…");
          return '<div class="row" style="justify-content:space-between; align-items:flex-start; gap:var(--sp-3); padding:6px 0; border-bottom:1px solid var(--border);">' +
            '<span>'+esc(modActionLabel(d.action))+(d.note?' — '+esc(d.note):'')+'</span>' +
            '<span class="tabular" style="color:var(--ink-muted); font-size:var(--fs-2xs); white-space:nowrap;">'+fmtDate(d.acted_at)+' · '+esc(who)+'</span>' +
          '</div>';
        }).join("") : '<p style="color:var(--ink-faint); margin:0;">Noch keine Entscheidung.</p>');

    return '<div class="stack">' +
      '<a href="#/moderation" style="font-size:var(--fs-sm);">&larr; Zurück zur Fallliste</a>' +
      '<div class="row" style="justify-content:space-between; align-items:center; flex-wrap:wrap; gap:var(--sp-3);">' +
        '<h1>Fall '+esc(c.case_number)+'</h1>' +
        (closed ? '<span class="chip chip-muted">Geschlossen</span>' : (c.escalated ? '<span class="chip chip-severe">Eskaliert</span>' : '<span class="chip chip-negative">Offen</span>')) +
      '</div>' +
      '<div class="card stack">' +
        '<div>'+plateChip(plate.display_plate || "?", null, plate.country_code || "DE")+
          (blocked?' <span class="chip chip-negative">Gesperrt</span>':'')+
          (hidden?' <span class="chip chip-muted">Aktuell verborgen</span>':'')+
        '</div>' +
        '<p style="margin:0;"><strong>Grund:</strong> '+esc(c.reason)+'</p>' +
        (c.description ? '<p style="margin:0; color:var(--ink-muted);"><strong>Angaben:</strong> '+esc(c.description)+'</p>' : '') +
        '<p style="margin:0; color:var(--ink-faint); font-size:var(--fs-2xs);">Eingegangen am '+fmtDate(c.created_at)+'</p>' +
      '</div>' +
      '<div class="card stack">' +
        '<p class="eyebrow" style="margin:0;">Maßnahme</p>' +
        '<div class="row" style="gap:var(--sp-3); flex-wrap:wrap;">' +
          (!closed && !blocked ? '<button class="btn btn-secondary btn-sm" data-mod-action="dismiss" data-case="'+esc(c.id)+'">Kein Verstoß — Fall schließen</button>' : '') +
          (!hidden && !closed && !blocked ? '<button class="btn btn-danger-ghost btn-sm" data-mod-action="hide" data-case="'+esc(c.id)+'">Profil vorläufig verbergen</button>' : '') +
          (hidden && !blocked ? '<button class="btn btn-secondary btn-sm" data-mod-action="unhide" data-case="'+esc(c.id)+'">Verbergen aufheben</button>' : '') +
          (!blocked && !closed ? '<button class="btn btn-danger-ghost btn-sm" data-mod-action="block" data-case="'+esc(c.id)+'">Kennzeichen sperren (bestätigter Verstoß)</button>' : '') +
          (blocked ? '<button class="btn btn-secondary btn-sm" data-mod-action="unblock" data-case="'+esc(c.id)+'">Sperrung aufheben</button>' : '') +
          (!closed && !c.escalated ? '<button class="btn btn-ghost btn-sm" data-mod-action="escalate" data-case="'+esc(c.id)+'">Eskalieren</button>' : '') +
        '</div>' +
        (!closed ? '<div>' +
          '<label class="field-label" for="mod-note">Notiz (optional, wird Teil des Audit-Protokolls)</label>' +
          '<textarea id="mod-note" maxlength="300" placeholder="z. B. Begründung der Entscheidung"></textarea>' +
        '</div>' : '') +
      '</div>' +
      '<div class="card stack">' +
        '<p class="eyebrow" style="margin:0;">Audit-Protokoll</p>' +
        decisionsHtml +
      '</div>' +
    '</div>';
  }

  /* ============================================================
     Event wiring
     ============================================================ */
  function wireContentEvents(r){
    var content = document.getElementById("content");

    // Suche
    var searchBtn = document.getElementById("btn-search");
    if (searchBtn) {
      var input = document.getElementById("plate-input");
      var searchBand = document.getElementById("plate-input-band");
      var searchHint = document.getElementById("plate-input-hint");
      input.focus();
      if (searchBand) input.addEventListener("input", function(){ updateAutoBand(searchBand, input.value, searchHint); });
      function doSearch(){
        var v = input.value.trim();
        if (!v) { toast("Bitte ein Kennzeichen eingeben."); return; }
        go("#/result/"+encodeURIComponent(v));
      }
      searchBtn.addEventListener("click", doSearch);
      input.addEventListener("keydown", function(e){ if (e.key==="Enter") doSearch(); });
      var gotoRate = document.getElementById("btn-goto-rate");
      if (gotoRate) gotoRate.addEventListener("click", function(){ rateCtx = {plateNorm:null, country:"DE", step:1}; go("#/rate"); });
    }

    // Ergebnis: melden / öffentlich machen / widerrufen
    var reportBtn = document.getElementById("btn-report");
    if (reportBtn) reportBtn.addEventListener("click", function(){ openReportModal(reportBtn.getAttribute("data-plate")); });
    var mkPublic = document.getElementById("btn-make-public");
    if (mkPublic) mkPublic.addEventListener("click", function(){ openOptInModal(); });
    var revoke = document.getElementById("btn-revoke-public");
    if (revoke) revoke.addEventListener("click", function(){
      var norm = mine_or_result_norm();
      var plateObj = getPlate(norm);
      if (!plateObj || !plateObj.hash) return;
      revoke.disabled = true;
      // Direktes UPDATE statt RPC (plates_update_owner-Policy), analog zu btn-unclaim. Bewusst ohne
      // eigenes Modal — Widerruf ist die "weniger tun"-Richtung, dafür braucht es keine erneute
      // Zustimmungsabfrage (anders als das erstmalige Veröffentlichen in openOptInModal()).
      db.from("plates").update({
        public_opt_in: false, public_opt_in_at: null, public_opt_in_consent_text: null
      }).eq("lookup_hash", plateObj.hash).then(function(res){
        if (res.error) throw res.error;
        delete state.plates[norm];
        toast("Öffentliche Freigabe beendet.");
        render();
      }).catch(function(err){
        toast("Fehler: " + ((err && err.message) || String(err)));
        revoke.disabled = false;
      });
    });

    // Bewerten: plate input step
    var rateContinue = document.getElementById("btn-rate-continue");
    if (rateContinue) {
      var ri = document.getElementById("rate-plate-input"); ri.focus();
      var rateBand = document.getElementById("rate-plate-band");
      var rateHint = document.getElementById("rate-plate-hint");
      if (rateBand) ri.addEventListener("input", function(){ updateAutoBand(rateBand, ri.value, rateHint); });
      rateContinue.addEventListener("click", function(){
        var v = ri.value.trim();
        var norm = normalizePlate(v);
        var det = detectCountry(v);
        if (!det.ok) { toast(det.message); return; }
        rateCtx = { plateNorm: norm, country: det.country, display: formatPlateDisplay(v), categoryKeys:[], step: 2 };
        render();
      });
      ri.addEventListener("keydown", function(e){ if (e.key==="Enter") rateContinue.click(); });
    }

    content.querySelectorAll("[data-cat]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var key = btn.getAttribute("data-cat");
        rateCtx.categoryKeys = rateCtx.categoryKeys || [];
        var idx = rateCtx.categoryKeys.indexOf(key);
        if (idx === -1) rateCtx.categoryKeys.push(key); else rateCtx.categoryKeys.splice(idx, 1);
        render();
      });
    });
    var rateBack = document.getElementById("btn-rate-back");
    if (rateBack) rateBack.addEventListener("click", function(){ rateCtx.step = Math.max(2, rateCtx.step-1); render(); });
    var rateNext = document.getElementById("btn-rate-next");
    if (rateNext) rateNext.addEventListener("click", function(){ rateCtx.step = 3; render(); });
    var rateSubmit = document.getElementById("btn-rate-submit");
    if (rateSubmit) rateSubmit.addEventListener("click", function(){
      var chk = document.getElementById("chk-not-driving");
      if (!chk.checked) { toast("Bitte bestätige, dass du nicht während der Fahrt bewertest."); return; }
      submitObservation();
    });

    // Mein Kennzeichen
    var claimBtn = document.getElementById("btn-claim");
    if (claimBtn) {
      var ci = document.getElementById("claim-input");
      var claimBand = document.getElementById("claim-input-band");
      var claimHint = document.getElementById("claim-input-hint");
      if (claimBand) { ci.addEventListener("input", function(){ updateAutoBand(claimBand, ci.value, claimHint); }); updateAutoBand(claimBand, ci.value, claimHint); }
      // Verifizierung erst möglich, nachdem der Fahrzeugschein-Nachweis bestätigt wurde — verhindert,
      // dass ein fremdes Kennzeichen ohne jeden Besitznachweis beansprucht werden kann.
      var claimDoc = document.getElementById("chk-fahrzeugschein");
      if (claimDoc) claimDoc.addEventListener("change", function(){ claimBtn.disabled = !claimDoc.checked; });
      claimBtn.addEventListener("click", function(){
        var v = ci.value.trim();
        var norm = normalizePlate(v);
        var det = detectCountry(v);
        if (!det.ok) { toast(det.message); return; }
        var country = det.country;
        var display = formatPlateDisplay(v);

        // claim_plate() (0004_functions.sql + 0005_claim_blocked_guard.sql) prüft serverseitig
        // moderation_blocked, bereits-fremd-verifiziert UND den Fahrzeugschein-Nachweis
        // (p_document_confirmed) - der Checkbox-Zustand hier ist zusätzlich zur disabled-Schaltung des
        // Buttons auch keine reine Client-Attrappe mehr.
        claimBtn.disabled = true;
        var origLabel = claimBtn.textContent;
        claimBtn.textContent = "Prüfe …";
        plateLookupHash(norm, country).then(function(hash){
          return db.rpc("claim_plate", {
            p_lookup_hash: hash, p_display_plate: display, p_country_code: country, p_document_confirmed: true
          });
        }).then(function(res){
          if (res.error) throw res.error;
          delete state.plates[norm]; // eigener Verifizierungsstatus hat sich geändert -> frisch nachladen
          state.currentUser.myPlateKey = norm;
          state.currentUser.myPlateCountry = country;
          claimCtx.blocked = null;
          toast(res.data && res.data.status === "already_yours" ? "War bereits deins." : "Verifizierung erfolgreich.");
          render();
        }).catch(function(err){
          var code = err && err.code;
          if (code === "P0004") {
            claimCtx.blocked = { norm: norm, display: display, country: country };
            render();
            return;
          }
          if (code === "P0003") {
            toast("Dieses Kennzeichen ist von der Moderation gesperrt und kann nicht verifiziert werden.");
          } else {
            toast("Fehler bei der Verifizierung: " + ((err && err.message) || String(err)));
          }
          claimBtn.disabled = false; claimBtn.textContent = origLabel;
        });
      });
    }
    var unclaim = document.getElementById("btn-unclaim");
    if (unclaim) unclaim.addEventListener("click", function(){
      var mineNorm = state.currentUser.myPlateKey;
      if (!mineNorm) return;
      var mineCountry = state.currentUser.myPlateCountry;
      unclaim.disabled = true;
      // Direktes UPDATE statt RPC: durch die plates_update_owner-Policy (0003_rls.sql) gedeckt, kein
      // eigener Server-Code nötig, nur der Eigentümer selbst darf seine eigene Zeile so ändern.
      plateLookupHash(mineNorm, mineCountry).then(function(hash){
        return db.from("plates").update({ verified_by: null, verified_at: null, document_confirmed_at: null }).eq("lookup_hash", hash);
      }).then(function(res){
        if (res.error) throw res.error;
        delete state.plates[mineNorm];
        state.currentUser.myPlateKey = null;
        state.currentUser.myPlateCountry = null;
        toast("Kennzeichen abgegeben.");
        render();
      }).catch(function(err){
        toast("Fehler: " + ((err && err.message) || String(err)));
        unclaim.disabled = false;
      });
    });

    // Freunde: gegenseitige private Freigabe über den Einladungslink (Phase 6.4) - Details siehe
    // Kommentar bei renderFriendsCard(). connectFriend() ist der gemeinsame Bestätigungspfad für
    // "Einladungslink öffnen" (btn-invite-connect) UND "Eingehende Anfrage" (data-connect-incoming):
    // in beiden Fällen ist es dasselbe INSERT einer einseitigen, konsentierten Kante.
    function connectFriend(targetId, triggerBtn, onDone){
      var preview = userPlatePreview[targetId];
      if (!preview || !preview.found) { toast("Kennzeichen nicht verfügbar."); return; }
      openFriendConsentModal({ display: preview.display, country: preview.country }, function(){
        if (triggerBtn) triggerBtn.disabled = true;
        db.from("friend_links").insert({
          from_user: state.currentUser.id, to_user: targetId,
          consented_at: new Date().toISOString(), consent_text: FRIEND_CONSENT_TEXT
        }).then(function(res){
          if (res.error) throw res.error;
          state.friendLinks = state.friendLinks || [];
          state.friendLinks.push({ from: state.currentUser.id, to: targetId, requestedAt: now(), consentedAt: now(), consentText: FRIEND_CONSENT_TEXT });
          // Falls das Profil der Gegenseite schon (als "privat/nicht sichtbar") gecacht war, jetzt
          // ungültig machen - könnte durch die neue (ggf. gegenseitige) Freundschaft sichtbar geworden sein.
          delete state.plates[normalizePlate(preview.display)];
          toast(isMutualFriend(targetId) ? "Ihr seid jetzt gegenseitig verbunden." : "Hinzugefügt — wird sichtbar, sobald die Gegenseite dich auch hinzufügt.");
          if (onDone) onDone(); else render();
        }).catch(function(err){
          toast("Fehler: " + ((err && err.message) || String(err)));
          if (triggerBtn) triggerBtn.disabled = false;
        });
      });
    }
    var inviteConnectBtn = document.getElementById("btn-invite-connect");
    if (inviteConnectBtn) inviteConnectBtn.addEventListener("click", function(){
      connectFriend(inviteConnectBtn.getAttribute("data-inviter"), inviteConnectBtn, function(){ go("#/myplate"); });
    });
    content.querySelectorAll("[data-connect-incoming]").forEach(function(btn){
      btn.addEventListener("click", function(){
        connectFriend(btn.getAttribute("data-connect-incoming"), btn);
      });
    });
    // friend_links wird nur einmal bei bootstrapState() geladen, es gibt kein Realtime/Polling (bewusst
    // einfach gehalten) - ohne diesen Button sieht A eine eingehende Anfrage von B erst nach einem vollen
    // Reload/Re-Login, was im Zwei-Konten-Test wie ein Bug aussieht. bootstrapState() lädt friendLinks neu,
    // ohne den plates-Mirror zu leeren (anders als btn-reset-demo) - das aktuell offene Profil bleibt erhalten.
    var refreshFriendsBtn = document.getElementById("btn-refresh-friends");
    if (refreshFriendsBtn) refreshFriendsBtn.addEventListener("click", function(){
      refreshFriendsBtn.disabled = true;
      var keepPlates = state.plates;
      db.auth.getSession().then(function(res){
        var session = res.data && res.data.session;
        if (!session) { toast("Nicht angemeldet."); return; }
        return bootstrapState(session.user).then(function(){
          state.plates = keepPlates;
          toast("Aktualisiert.");
          render();
        });
      }).catch(function(err){
        toast("Fehler: " + ((err && err.message) || String(err)));
        refreshFriendsBtn.disabled = false;
      });
    });
    var copyInviteBtn = document.getElementById("btn-copy-invite");
    if (copyInviteBtn) copyInviteBtn.addEventListener("click", function(){
      var field = document.getElementById("invite-link-field");
      var link = field ? field.value : "";
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(function(){ toast("Link kopiert."); }).catch(function(){
          if (field) field.select();
          toast("Kopieren nicht möglich — Link ist markiert, manuell kopieren.");
        });
      } else if (field) {
        field.select();
        toast("Link ist markiert — manuell kopieren.");
      }
    });
    content.querySelectorAll("[data-remove-friend]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var to = btn.getAttribute("data-remove-friend");
        var preview = userPlatePreview[to];
        btn.disabled = true;
        // Bewusst ohne jede Benachrichtigung an die Gegenseite — siehe Kommentar bei renderFriendsCard().
        db.from("friend_links").delete().eq("from_user", state.currentUser.id).eq("to_user", to)
          .then(function(res){
            if (res.error) throw res.error;
            state.friendLinks = (state.friendLinks||[]).filter(function(l){ return !(l.from===state.currentUser.id && l.to===to); });
            if (preview && preview.found) delete state.plates[normalizePlate(preview.display)];
            render();
          }).catch(function(err){
            toast("Fehler: " + ((err && err.message) || String(err)));
            btn.disabled = false;
          });
      });
    });

    // Übernahme-Flow für bereits fremdverifizierte Kennzeichen (Halterwechsel-Simulation)
    var transferRequestBtn = document.getElementById("btn-transfer-request");
    var transferDoc = document.getElementById("chk-fahrzeugschein-transfer");
    if (transferDoc && transferRequestBtn) transferDoc.addEventListener("change", function(){ transferRequestBtn.disabled = !transferDoc.checked; });
    if (transferRequestBtn) transferRequestBtn.addEventListener("click", function(){
      var b = claimCtx.blocked; var p = b && getPlate(b.norm);
      if (!p) return;
      if (p.moderationBlocked) { toast("Dieses Kennzeichen ist von der Moderation gesperrt und kann nicht übernommen werden."); return; }
      p.transferRequest = { by: state.currentUser.id, requestedAt: now(), deadlineAt: now() + TRANSFER_WINDOW_DAYS*DAY, documentConfirmedAt: now() };
      saveState(state); render();
    });
    var transferCancelBtn = document.getElementById("btn-transfer-cancel");
    if (transferCancelBtn) transferCancelBtn.addEventListener("click", function(){
      var b = claimCtx.blocked; var p = b && getPlate(b.norm);
      if (p) delete p.transferRequest;
      saveState(state); render();
    });
    var transferFinishBtn = document.getElementById("btn-transfer-finish");
    if (transferFinishBtn) transferFinishBtn.addEventListener("click", function(){
      var b = claimCtx.blocked; var p = b && getPlate(b.norm);
      if (!p) return;
      p.verifiedBy = state.currentUser.id;
      p.verifiedAt = now();
      delete p.transferRequest;
      state.currentUser.myPlateKey = b.norm;
      claimCtx.blocked = null;
      saveState(state);
      toast("Übernahme abgeschlossen (Demo).");
      render();
    });
    var claimCancelBtn = document.getElementById("btn-claim-cancel");
    if (claimCancelBtn) claimCancelBtn.addEventListener("click", function(){
      claimCtx.blocked = null; render();
    });

    // Moderation: Fallliste manuell nachladen (kein Realtime/Polling, gleiches Muster wie der
    // Freunde-Refresh-Button, siehe renderFriendsCard()-Kommentar).
    var modRefreshBtn = document.getElementById("btn-mod-refresh");
    if (modRefreshBtn) modRefreshBtn.addEventListener("click", function(){
      modRefreshBtn.disabled = true;
      ensureModerationCasesLoaded(true);
    });

    // Moderation: Maßnahme wählen. apply_moderation_decision() (0004_functions.sql) prüft is_moderator()
    // serverseitig und schreibt zuerst ins unveränderliche Audit-Log (moderation_actions), danach die
    // Plate-/Case-Flags - der Client verlässt sich hier nur auf das Ergebnis, keine eigene Logik mehr.
    content.querySelectorAll("[data-mod-action]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var caseId = btn.getAttribute("data-case");
        var action = btn.getAttribute("data-mod-action");
        var noteEl = document.getElementById("mod-note");
        var note = noteEl ? noteEl.value.trim() : "";
        btn.disabled = true;
        db.rpc("apply_moderation_decision", { p_case_id: caseId, p_action: action, p_note: note || null })
          .then(function(res){
            if (res.error) throw res.error;
            // Case-Liste UND das Audit-Protokoll dieses Falls sind jetzt veraltet - beide neu laden.
            // Betroffenes Kennzeichen zusätzlich aus dem plates-Mirror werfen: hide/block wirkt sich sofort
            // auf dessen Sichtbarkeit anderswo aus (z. B. viewResult() für dieses Kennzeichen).
            var c = (moderationCasesCache && moderationCasesCache.list || []).filter(function(x){ return x.id===caseId; })[0];
            if (c && c.plates && c.plates.display_plate) delete state.plates[normalizePlate(c.plates.display_plate)];
            delete moderationDecisionsCache[caseId];
            toast("Entscheidung gespeichert: " + modActionLabel(action));
            ensureModerationCasesLoaded(true);
          }).catch(function(err){
            btn.disabled = false;
            var code = err && err.code;
            toast(code === "P0006" ? "Keine Moderationsrechte für dieses Konto." : "Fehler: " + ((err && err.message) || String(err)));
          });
      });
    });

    // War früher "Demo-Daten zurücksetzen" (seedState()) - das würde jetzt den echten, aus Supabase
    // geladenen state komplett durch lokale Phantasiedaten ersetzen und die Sitzung zerschießen. Lädt
    // stattdessen den eigenen echten Stand neu.
    var resetBtn = document.getElementById("btn-reset-demo");
    if (resetBtn) resetBtn.addEventListener("click", function(){
      resetBtn.disabled = true;
      db.auth.getSession().then(function(res){
        var session = res.data && res.data.session;
        if (!session) { toast("Nicht angemeldet."); return; }
        return bootstrapState(session.user).then(function(){
          state.plates = {};
          toast("Daten neu geladen.");
          go("#/search");
          render();
        });
      }).catch(function(err){
        toast("Fehler: " + ((err && err.message) || String(err)));
      }).then(function(){
        resetBtn.disabled = false;
      });
    });
  }

  function mine_or_result_norm(){
    var r = parseRoute();
    if (r.route === "myplate") return state.currentUser.myPlateKey;
    if (r.route === "result") return normalizePlate(decodeURIComponent(r.params[0]||""));
    return null;
  }

  // Mehrfachauswahl (bewusste Abweichung von Spec §8.2.4 "genau eine Kategorie", auf ausdrücklichen
  // Nutzerwunsch): jede gewählte Kategorie wird als EIGENE Beobachtung gespeichert. Rate-Limits (24h/
  // Kennzeichen, 30 Tage/Kategorie) werden jetzt von submit_observations() serverseitig erzwungen
  // (0004_functions.sql) statt hier im Client durch Scannen von localStorage simuliert - das war
  // vorher trivial umgehbar (Konsole öffnen, localStorage direkt ändern).
  function submitObservation(){
    var norm = rateCtx.plateNorm;
    var keys = rateCtx.categoryKeys || [];
    if (!keys.length) { toast("Bitte mindestens eine Kategorie wählen."); return; }

    var submitBtn = document.getElementById("btn-rate-submit");
    var origLabel = submitBtn ? submitBtn.textContent : "";
    function resetBtn(){ if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = origLabel; } }
    if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = "Sende …"; }

    plateLookupHash(norm, rateCtx.country).then(function(hash){
      return db.rpc("submit_observations", {
        p_lookup_hash: hash, p_display_plate: rateCtx.display, p_country_code: rateCtx.country, p_category_keys: keys
      });
    }).then(function(res){
      if (res.error) throw res.error;
      var accepted = res.data.accepted || [];
      var skipped = res.data.skipped || [];
      if (!accepted.length) {
        toast("Alle gewählten Kategorien hast du für dieses Kennzeichen in den letzten 30 Tagen schon vergeben.");
        resetBtn();
        return;
      }
      lastSubmitResult = { accepted: accepted, skipped: skipped };
      delete state.plates[norm]; // eigener Beitrag verändert den Score -> beim nächsten Ansehen frisch laden
      // plateNorm zurücksetzen (nicht display, das braucht die Bestätigungsseite noch), damit ein
      // erneuter Eintritt in denselben oder einen anderen Bewertungsablauf sauber bei Schritt 2 startet.
      rateCtx = { plateNorm: null, display: rateCtx.display, categoryKeys: [], step: 1 };
      go("#/confirmed");
    }).catch(function(err){
      var code = err && err.code;
      if (code === "P0001") toast("Du hast dieses Kennzeichen in den letzten 24 Stunden bereits bewertet.");
      else if (code === "P0003") toast("Dieses Kennzeichen ist von der Moderation gesperrt und kann nicht bewertet werden.");
      else toast("Fehler beim Speichern: " + ((err && err.message) || String(err)));
      resetBtn();
    });
  }

  /* ---------- Modals ---------- */
  var modalCloseCleanup = null;
  function openModal(innerHtml, onMount){
    var root = document.getElementById("modal-root");
    var opener = document.activeElement;
    root.innerHTML = '<div class="modal-backdrop" id="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">'+innerHtml+'</div></div>';
    document.getElementById("modal-backdrop").addEventListener("click", function(e){
      if (e.target.id==="modal-backdrop") closeModal();
    });
    // Tastatur/Fokus: Escape schließt, Fokus geht beim Öffnen ins Dialogfeld und beim Schließen
    // zurück zum auslösenden Button — vorher gab es keins von beidem.
    function onKey(e){ if (e.key==="Escape") closeModal(); }
    document.addEventListener("keydown", onKey);
    modalCloseCleanup = function(){
      document.removeEventListener("keydown", onKey);
      if (opener && typeof opener.focus === "function") opener.focus();
    };
    var dialogEl = root.querySelector(".modal");
    if (dialogEl) dialogEl.focus();
    if (onMount) onMount();
  }
  function closeModal(){
    document.getElementById("modal-root").innerHTML = "";
    if (modalCloseCleanup) { modalCloseCleanup(); modalCloseCleanup = null; }
  }

  function openReportModal(norm){
    // norm wurde bisher entgegengenommen, aber nirgends verwendet — weder im Dialog angezeigt noch
    // beim "Senden" ausgelesen. Ohne Anzeige, welches Kennzeichen gemeldet wird, kann der Nutzer
    // nicht prüfen, ob er das richtige Profil meldet; ohne Auslesen von Grund/Freitext war das
    // Formular rein dekorativ.
    var plateObj = getPlate(norm);
    var display = (plateObj && plateObj.display) || norm;
    if (!plateObj || !plateObj.id) { toast("Profil noch nicht geladen — bitte kurz warten und erneut versuchen."); return; }
    openModal(
      '<h3 id="modal-title">Profil oder Ergebnis melden</h3>' +
      '<p style="color:var(--ink-muted); font-size:var(--fs-sm);">Kennzeichen: '+plateChip(display)+'<br/>Wähle einen Grund. Freitext wird nur im privaten Support-Kanal gelesen und nie veröffentlicht.</p>' +
      '<div class="stack">' +
        '<div>' +
          '<label class="field-label" for="report-reason">Grund</label>' +
          '<select id="report-reason">' +
            '<option value="Manipulationsverdacht">Manipulationsverdacht</option>' +
            '<option value="Falsches Kennzeichen">Falsches Kennzeichen</option>' +
            '<option value="Datenschutzanfrage">Datenschutzanfrage</option>' +
            '<option value="Technische Fehlzuordnung">Technische Fehlzuordnung</option>' +
          '</select>' +
        '</div>' +
        '<div>' +
          '<label class="field-label" for="report-text">Zusätzliche Angaben (optional)</label>' +
          '<textarea id="report-text" maxlength="500" placeholder="Optional: zusätzliche Angaben (privat, nicht öffentlich)"></textarea>' +
        '</div>' +
        '<div class="row" style="justify-content:flex-end; gap:var(--sp-3);">' +
          '<button class="btn btn-secondary" id="modal-cancel">Abbrechen</button>' +
          '<button class="btn btn-primary" id="modal-send">Fallnummer anfordern</button>' +
        '</div>' +
      '</div>',
      function(){
        var reasonSel = document.getElementById("report-reason");
        reasonSel.focus();
        document.getElementById("modal-cancel").addEventListener("click", closeModal);
        var sendBtn = document.getElementById("modal-send");
        sendBtn.addEventListener("click", function(){
          var reason = reasonSel.value;
          var text = document.getElementById("report-text").value.trim();
          sendBtn.disabled = true;
          // moderation_cases_insert_authenticated (0003_rls.sql) verlangt reported_by = auth.uid() explizit
          // im INSERT - kein Trigger füllt das automatisch. case_number wird serverseitig per DEFAULT
          // generiert (0001_schema.sql), deshalb .select() um sie zurückzubekommen statt selbst zu raten.
          db.from("moderation_cases").insert({
            plate_id: plateObj.id, reason: reason, description: text || null, reported_by: state.currentUser.id
          }).select("case_number").single().then(function(res){
            if (res.error) throw res.error;
            closeModal();
            toast("Fallnummer "+res.data.case_number+" angefordert — Grund: "+reason+" ("+display+").");
          }).catch(function(err){
            toast("Fehler: " + ((err && err.message) || String(err)));
            sendBtn.disabled = false;
          });
        });
      }
    );
  }

  // Genauer Wortlaut, dem beim öffentlichen Opt-in zugestimmt wird — wird 1:1 mit auf dem
  // Kennzeichen gespeichert (nicht nur ein Zeitstempel), damit dokumentiert bleibt, dass und wozu
  // genau die Halterin/der Halter selbst freiwillig zugestimmt hat, falls der Text sich später ändert.
  var PUBLIC_OPTIN_CONSENT_TEXT = "Ich möchte das aggregierte RoadRep-Profil dieses Kennzeichens freiwillig öffentlich anzeigen. Mir ist bekannt, dass Halter und Fahrer unterschiedliche Personen sein können. Ich kann die Freigabe jederzeit widerrufen.";

  function openOptInModal(route){
    var norm = mine_or_result_norm();
    var plateObj = getPlate(norm);
    // plateObj kommt bereits fertig geladen von get_plate_profile() (ensurePlateLoaded() lief vorher
    // für dieses Profil, sonst gäbe es den auslösenden Button gar nicht) - .agg ist derselbe Score, der
    // nach der Freigabe auch öffentlich sichtbar wäre (Formel ist tierunabhängig, siehe Kommentar bei
    // MIN_OBS oben), .hash ist der lookup_hash für das UPDATE unten.
    if (!plateObj || !plateObj.hash) { toast("Profil noch nicht geladen — bitte kurz warten und erneut versuchen."); return; }
    var agg = plateObj.agg;
    openModal(
      '<h3 id="modal-title">Profil öffentlich machen</h3>' +
      '<p style="color:var(--ink-muted); font-size:var(--fs-sm);">Vorschau der Daten, die künftig öffentlich sichtbar wären:</p>' +
      '<div class="card" style="background:var(--bg-sunken);">' +
        (agg.enoughData
          ? '<div class="row"><span class="score-number tabular" style="font-size:var(--fs-xl);">'+agg.score+'</span><span class="chip '+typeChipClass("neutral")+'">Vertrauensstufe: '+agg.trust+'</span></div>'
          : '<p style="margin:0;">Noch kein numerischer Score (zu wenig Daten).</p>') +
      '</div>' +
      '<label class="row" style="align-items:flex-start; gap:var(--sp-3); margin:var(--sp-4) 0; cursor:pointer;">' +
        '<input type="checkbox" id="optin-confirm"/>' +
        '<span style="font-size:var(--fs-sm);">'+esc(PUBLIC_OPTIN_CONSENT_TEXT)+'</span>' +
      '</label>' +
      '<div class="row" style="justify-content:flex-end; gap:var(--sp-3);">' +
        '<button class="btn btn-secondary" id="modal-cancel">Abbrechen</button>' +
        '<button class="btn btn-primary" id="modal-confirm-optin" disabled>Veröffentlichen</button>' +
      '</div>',
      function(){
        document.getElementById("modal-cancel").addEventListener("click", closeModal);
        var chk = document.getElementById("optin-confirm");
        var confirmBtn = document.getElementById("modal-confirm-optin");
        chk.addEventListener("change", function(){ confirmBtn.disabled = !chk.checked; });
        confirmBtn.addEventListener("click", function(){
          confirmBtn.disabled = true;
          // Direktes UPDATE statt RPC: durch die plates_update_owner-Policy (0003_rls.sql) gedeckt, nur
          // der Eigentümer selbst darf seine eigene Zeile so ändern. Zustimmungstext wird mitgespeichert
          // (nicht nur ein Boolean+Zeitstempel) — belegt, WOZU genau zugestimmt wurde, falls der Text
          // später verändert wird.
          db.from("plates").update({
            public_opt_in: true,
            public_opt_in_at: new Date().toISOString(),
            public_opt_in_consent_text: PUBLIC_OPTIN_CONSENT_TEXT
          }).eq("lookup_hash", plateObj.hash).then(function(res){
            if (res.error) throw res.error;
            delete state.plates[norm]; // Mirror invalidieren -> frisch nachladen
            closeModal(); toast("Profil ist jetzt öffentlich sichtbar.");
            render();
          }).catch(function(err){
            confirmBtn.disabled = false;
            toast("Fehler: " + ((err && err.message) || String(err)));
          });
        });
      }
    );
  }

  // Analog zu PUBLIC_OPTIN_CONSENT_TEXT (§8.6): explizite, protokollierte Zustimmung auch fürs
  // Hinzufügen eines Freundes (§8.8/§23.8 der Spec — vorher fehlte hier ein gleichwertiger
  // Consent-Schritt, obwohl das Ergebnis derselbe volle Profilzugriff ist wie beim öffentlichen Opt-in).
  var FRIEND_CONSENT_TEXT = "Ich möchte mit diesem Kennzeichen eine gegenseitige Verbindung herstellen. Mir ist bewusst: Sobald die Gegenseite mich ebenfalls hinzufügt, sehen wir beide gegenseitig das jeweils private Profil des anderen — bis eine Seite die Verbindung wieder entfernt.";

  // Jede Seite bestätigt für sich selbst in ihrem eigenen Klick-Moment (nicht erst beim
  // abschließenden, zweiten Hinzufügen) — so entsteht Sichtbarkeit nie ausschließlich durch eine
  // fremde Aktion, ohne dass man selbst aktiv zugestimmt hat.
  function openFriendConsentModal(targetPlate, onConfirmed){
    openModal(
      '<h3 id="modal-title">Gegenseitige Verbindung herstellen</h3>' +
      '<p style="color:var(--ink-muted); font-size:var(--fs-sm);">Du fügst hinzu:</p>' +
      '<div class="card" style="background:var(--bg-sunken);">'+plateChip(targetPlate.display, null, targetPlate.country)+'</div>' +
      '<label class="row" style="align-items:flex-start; gap:var(--sp-3); margin:var(--sp-4) 0; cursor:pointer;">' +
        '<input type="checkbox" id="friend-consent-confirm"/>' +
        '<span style="font-size:var(--fs-sm);">'+esc(FRIEND_CONSENT_TEXT)+'</span>' +
      '</label>' +
      '<div class="row" style="justify-content:flex-end; gap:var(--sp-3);">' +
        '<button class="btn btn-secondary" id="modal-cancel">Abbrechen</button>' +
        '<button class="btn btn-primary" id="modal-confirm-friend" disabled>Hinzufügen</button>' +
      '</div>',
      function(){
        document.getElementById("modal-cancel").addEventListener("click", closeModal);
        var chk = document.getElementById("friend-consent-confirm");
        var confirmBtn = document.getElementById("modal-confirm-friend");
        chk.addEventListener("change", function(){ confirmBtn.disabled = !chk.checked; });
        confirmBtn.addEventListener("click", function(){
          closeModal();
          onConfirmed();
        });
      }
    );
  }

  /* ---------- Auth: Login (Magic Link) und Bootstrap ---------- */
  var loginCtx = { sent: false, email: "" };

  function viewLogin(){
    if (loginCtx.sent) {
      return '<div class="stack">' +
        '<h1>Prüfe deine E-Mails</h1>' +
        '<div class="callout">Wir haben einen Anmeldelink an <strong>'+esc(loginCtx.email)+'</strong> geschickt. Öffne die E-Mail auf diesem Gerät und klicke den Link, um dich anzumelden.</div>' +
        '<button class="btn btn-secondary" id="btn-login-retry">Andere E-Mail-Adresse verwenden</button>' +
      '</div>';
    }
    return '<div class="stack">' +
      '<div class="start-hero">' +
        '<img class="start-icon" src="'+BRAND_ICON_SRC+'" alt="" width="72" height="72" />' +
        '<div><h1>Anmelden</h1><p style="color:var(--ink-muted)">Gib deine E-Mail-Adresse ein — wir schicken dir einen Anmeldelink, kein Passwort nötig.</p></div>' +
      '</div>' +
      '<div class="card stack">' +
        '<div>' +
          '<label class="field-label" for="login-email">E-Mail-Adresse</label>' +
          '<input id="login-email" type="email" placeholder="du@beispiel.de" autocomplete="email" />' +
        '</div>' +
        '<div class="row" style="justify-content:flex-end;">' +
          '<button class="btn btn-primary" id="btn-login-send">Anmeldelink senden</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function wireLoginEvents(){
    var sendBtn = document.getElementById("btn-login-send");
    var emailInput = document.getElementById("login-email");
    function doSend(){
      var email = ((emailInput && emailInput.value) || "").trim();
      if (!email) { toast("Bitte E-Mail-Adresse eingeben."); return; }
      sendBtn.disabled = true; sendBtn.textContent = "Sende …";
      db.auth.signInWithOtp({ email: email, options: { emailRedirectTo: window.location.href } })
        .then(function(res){
          if (res.error) { toast("Fehler: " + res.error.message); sendBtn.disabled = false; sendBtn.textContent = "Anmeldelink senden"; return; }
          loginCtx.sent = true; loginCtx.email = email;
          render();
        });
    }
    if (sendBtn) sendBtn.addEventListener("click", doSend);
    if (emailInput) emailInput.addEventListener("keydown", function(e){ if (e.key==="Enter") doSend(); });
    var retryBtn = document.getElementById("btn-login-retry");
    if (retryBtn) retryBtn.addEventListener("click", function(){ loginCtx.sent = false; render(); });
  }

  // Ersetzt loadState(): lädt den Zustand der eingeloggten Person aus Supabase in den
  // bestehenden state-Mirror, damit die Render-Funktionen unverändert synchron daraus lesen
  // können (siehe Plan, Phase 5/6 -- "in-memory local mirror"-Strategie).
  function bootstrapState(user){
    var newState = {
      currentUser: { id: user.id, email: user.email, myPlateKey: null, myPlateCountry: null, isModerator: false },
      friendLinks: [],
      plates: {}
    };
    return Promise.all([
      db.from("plates").select("lookup_hash,display_plate").eq("verified_by", user.id).maybeSingle(),
      db.from("friend_links").select("from_user,to_user,requested_at,consented_at,consent_text")
        .or("from_user.eq." + user.id + ",to_user.eq." + user.id),
      db.from("moderators").select("user_id").eq("user_id", user.id).maybeSingle()
    ]).then(function(results){
      var myPlateRes = results[0], linksRes = results[1], modRes = results[2];
      if (myPlateRes.data) {
        // myPlateKey muss eine normalisierte Kennzeichen-Zeichenkette sein (Mirror-Key, Vergleichswert
        // in isMine-Prüfungen), NICHT der lookup_hash — sonst matcht nichts mehr, das mit
        // normalizePlate() aus Nutzereingaben gebildet wird. Aus display_plate rückgewinnen, dieselbe
        // Quelle, aus der auch claim_plate() ursprünglich den Hash gebildet hat.
        var myDet = detectCountry(myPlateRes.data.display_plate);
        newState.currentUser.myPlateKey = normalizePlate(myPlateRes.data.display_plate);
        newState.currentUser.myPlateCountry = myDet.ok ? myDet.country : "DE";
      }
      newState.friendLinks = (linksRes.data || []).map(function(l){
        return {
          from: l.from_user, to: l.to_user,
          requestedAt: new Date(l.requested_at).getTime(),
          consentedAt: l.consented_at ? new Date(l.consented_at).getTime() : null,
          consentText: l.consent_text
        };
      });
      newState.currentUser.isModerator = !!modRes.data;
      state = newState;
    });
  }

  window.addEventListener("hashchange", render);

  db.auth.onAuthStateChange(function(event, session){
    if (session) {
      bootstrapState(session.user).then(function(){
        if (!location.hash) location.hash = "#/search";
        render();
      });
    } else {
      state = null;
      render();
    }
  });

  // Zeigt sofort den Login-Screen, noch bevor die erste Antwort von onAuthStateChange da ist.
  window.addEventListener("DOMContentLoaded", render);
  if (document.readyState !== "loading") { render(); }
})();
</script>
</body>
</html>
