<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RoadRep — Prototyp</title>
<style>
  /* ============ Tokens ============ */
  :root {
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", "SF Mono", "Consolas", "Liberation Mono", monospace;

    --fs-2xs: .75rem; --fs-xs: .8125rem; --fs-sm: .9375rem; --fs-base: 1rem;
    --fs-md: 1.125rem; --fs-lg: 1.375rem; --fs-xl: 1.75rem; --fs-2xl: 2.75rem;

    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;

    --radius-sm: 8px; --radius-md: 14px; --radius-lg: 20px; --radius-pill: 999px;

    --shadow-1: 0 1px 2px rgba(20,24,29,.06), 0 1px 1px rgba(20,24,29,.04);
    --shadow-2: 0 12px 32px rgba(20,24,29,.16), 0 2px 8px rgba(20,24,29,.08);

    /* light palette */
    --bg: #F4F6F5;
    --bg-elevated: #FFFFFF;
    --bg-sunken: #EBEEED;
    --ink: #14181D;
    --ink-muted: #565F68;
    --ink-faint: #838C93;
    --border: #DCE1E2;
    --border-strong: #C2C9CB;

    --accent: #C8460A;
    --accent-ink: #FFFFFF;
    --accent-soft: #FDEDE3;
    --accent-strong: #9C3708;
    --accent-vivid: #FD5F08;

    --positive: #2F6B47;
    --positive-soft: #E3F1E7;
    --neutral-cat: #786F5C;
    --neutral-cat-soft: #EFEBE1;
    --negative: #B03434;
    --negative-soft: #FBE7E5;
    --negative-severe: #7A2320;
    --negative-severe-soft: #F1D8D2;

    --focus-ring: 0 0 0 3px rgba(200,70,10,.35);

    --plate-bg: #FCFCF9;
    --plate-ink: #14181D;
    --plate-band: #1F4E8C;
    --plate-band-ink: #F4F6F5;
    --plate-border: #B7BDC0;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171B;
      --bg-elevated: #23272E;
      --bg-sunken: #101316;
      --ink: #EDEFF1;
      --ink-muted: #AEB7BF;
      --ink-faint: #7C8791;
      --border: #565F6A;
      --border-strong: #6C7580;

      --accent: #FF8A4D;
      --accent-ink: #241004;
      --accent-soft: #3A2013;
      --accent-strong: #FFAF7A;
      --accent-vivid: #FF7A33;

      --positive: #7BC298;
      --positive-soft: #1B2E22;
      --neutral-cat: #C2B99F;
      --neutral-cat-soft: #26231A;
      --negative: #E88080;
      --negative-soft: #34201F;
      --negative-severe: #F2A090;
      --negative-severe-soft: #3A2118;

      --focus-ring: 0 0 0 3px rgba(255,138,77,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171B; --bg-elevated: #23272E; --bg-sunken: #101316;
    --ink: #EDEFF1; --ink-muted: #AEB7BF; --ink-faint: #7C8791;
    --border: #565F6A; --border-strong: #6C7580;
    --accent: #FF8A4D; --accent-ink: #241004; --accent-soft: #3A2013; --accent-strong: #FFAF7A; --accent-vivid: #FF7A33;
    --positive: #7BC298; --positive-soft: #1B2E22;
    --neutral-cat: #C2B99F; --neutral-cat-soft: #26231A;
    --negative: #E88080; --negative-soft: #34201F;
    --negative-severe: #F2A090; --negative-severe-soft: #3A2118;
    --focus-ring: 0 0 0 3px rgba(255,138,77,.4);
  }
  :root[data-theme="light"] {
    --bg: #F4F6F5; --bg-elevated: #FFFFFF; --bg-sunken: #EBEEED;
    --ink: #14181D; --ink-muted: #565F68; --ink-faint: #838C93;
    --border: #DCE1E2; --border-strong: #C2C9CB;
    --accent: #C8460A; --accent-ink: #FFFFFF; --accent-soft: #FDEDE3; --accent-strong: #9C3708; --accent-vivid: #FD5F08;
    --positive: #2F6B47; --positive-soft: #E3F1E7;
    --neutral-cat: #786F5C; --neutral-cat-soft: #EFEBE1;
    --negative: #B03434; --negative-soft: #FBE7E5;
    --negative-severe: #7A2320; --negative-severe-soft: #F1D8D2;
    --focus-ring: 0 0 0 3px rgba(200,70,10,.35);
  }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: var(--fs-base);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }
  h1,h2,h3,h4 { margin: 0 0 var(--sp-2); text-wrap: balance; font-weight: 700; letter-spacing: -.01em; }
  p { margin: 0 0 var(--sp-3); color: var(--ink); }
  a { color: var(--accent); }
  /* button erbt per UA-Stylesheet standardmäßig KEIN color (font-family schon) — deshalb blieben
     .cat-card-Buttons (Kategorie-/Typ-Auswahl) in fixer OS-Buttonfarbe hängen statt der Theme-Farbe
     zu folgen, was sie im Dark Mode auf dunklem Grund fast unlesbar machte. */
  button { font-family: inherit; color: inherit; }
  :focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }
  ::selection { background: var(--accent-soft); }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
  .tabular { font-variant-numeric: tabular-nums; }
  .eyebrow {
    font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: .09em;
    font-weight: 700; color: var(--accent);
  }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  /* ============ Shell ============ */
  .app-shell {
    display: grid;
    grid-template-columns: 240px 1fr;
    grid-template-rows: auto 1fr;
    grid-template-areas: "topbar topbar" "nav main";
    min-height: 100vh;
  }
  @media (max-width: 780px) {
    .app-shell { grid-template-columns: 1fr; grid-template-areas: "topbar" "main" "nav"; }
  }

  .topbar {
    grid-area: topbar;
    display: flex; align-items: center; gap: var(--sp-3);
    padding: var(--sp-3) var(--sp-5);
    border-bottom: 1px solid var(--border);
    background: var(--bg-elevated);
    position: sticky; top: 0; z-index: 20;
  }
  .wordmark { display:flex; align-items:center; gap: var(--sp-2); text-decoration:none; color:var(--ink); }
  .wordmark .brand-mark { flex: none; border-radius: 8px; display:block; }
  .brand-textblock { display:flex; flex-direction:column; gap:3px; }
  .brand-wordmark { display:block; width:auto; }
  .brand-tagline { font-size: var(--fs-2xs); color: var(--ink-muted); font-weight:500; white-space:nowrap; }
  @media (max-width:480px){ .brand-tagline{ display:none; } }

  .start-hero { display:flex; align-items:center; gap: var(--sp-4); }
  .start-hero .start-icon { flex:none; border-radius: var(--radius-lg); box-shadow: var(--shadow-1); }
  .start-hero h1 { margin-bottom: 4px; }
  @media (max-width:560px){
    .start-hero { flex-direction:column; align-items:flex-start; gap: var(--sp-3); }
    .start-hero .start-icon { width:56px; height:56px; }
  }
  .topbar .demo-flag {
    margin-left: auto;
    display:flex; align-items:center; gap: var(--sp-2);
    font-size: var(--fs-2xs); color: var(--accent-strong);
    background: var(--accent-soft); border: 1px solid var(--accent);
    padding: 5px 10px; border-radius: var(--radius-pill); font-weight: 700; letter-spacing:.03em;
    white-space: nowrap;
  }
  .topbar .demo-flag .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none; }

  nav.mainnav {
    grid-area: nav;
    border-right: 1px solid var(--border);
    background: var(--bg-elevated);
    padding: var(--sp-4) var(--sp-3);
    display: flex; flex-direction: column; gap: var(--sp-1);
  }
  @media (max-width: 780px) {
    nav.mainnav {
      border-right: none; border-top: 1px solid var(--border);
      flex-direction: row; justify-content: space-around;
      padding: var(--sp-2); position: sticky; bottom:0; z-index: 20;
    }
    nav.mainnav .navlabel-desktop { display:none; }
  }
  .navlink {
    display:flex; align-items:center; gap: var(--sp-3);
    padding: 11px var(--sp-3); border-radius: var(--radius-md);
    color: var(--ink-muted); text-decoration:none; font-weight: 600; font-size: var(--fs-sm);
    border: 1px solid transparent; min-height: 44px;
  }
  .navlink svg { flex:none; opacity:.85; }
  .navlink:hover { background: var(--bg-sunken); color: var(--ink); }
  .navlink.active { background: var(--accent-soft); color: var(--accent-strong); border-color: var(--accent); }
  .navlink.disabled { opacity:.5; cursor:default; }
  .navlink .soon { margin-left:auto; font-size: var(--fs-2xs); background:var(--bg-sunken); color:var(--ink-faint); padding:2px 7px; border-radius:var(--radius-pill); font-weight:700; }
  @media (max-width:780px){ .navlink { flex-direction:column; gap:2px; font-size: var(--fs-2xs); padding: 8px 6px; } .navlink .soon{display:none;} }

  main.content {
    grid-area: main;
    padding: var(--sp-6) var(--sp-5) var(--sp-8);
    max-width: 880px;
  }
  @media (max-width: 780px) { main.content { padding: var(--sp-4) var(--sp-4) var(--sp-7); } }

  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: var(--sp-5);
    box-shadow: var(--shadow-1);
  }
  .stack { display:flex; flex-direction:column; gap: var(--sp-4); }
  .row { display:flex; gap: var(--sp-3); align-items:center; }
  .grid-2 { display:grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
  @media (max-width:560px){ .grid-2 { grid-template-columns: 1fr; } }

  /* ============ Buttons / inputs ============ */
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap: var(--sp-2);
    min-height: 44px; padding: 0 var(--sp-4);
    border-radius: var(--radius-md); border: 1px solid transparent;
    font-weight: 700; font-size: var(--fs-sm); cursor: pointer;
    transition: transform .06s ease, background .15s ease, border-color .15s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { background: var(--accent-strong); }
  .btn-secondary { background: var(--bg-elevated); color: var(--ink); border-color: var(--border-strong); }
  .btn-secondary:hover { background: var(--bg-sunken); }
  .btn-ghost { background: transparent; color: var(--accent); border-color: transparent; }
  .btn-ghost:hover { background: var(--accent-soft); }
  .btn-danger-ghost { background: transparent; color: var(--negative); border: 1px solid var(--negative); }
  .btn-danger-ghost:hover { background: var(--negative-soft); }
  .btn-block { width:100%; }
  .btn[disabled] { opacity:.5; cursor:not-allowed; }
  .btn-sm { min-height: 36px; padding: 0 var(--sp-3); font-size: var(--fs-xs); }

  label.field-label { display:block; font-size: var(--fs-xs); font-weight:700; color: var(--ink-muted); margin-bottom: 6px; }
  input[type=text], select, textarea {
    width:100%; min-height: 44px; padding: 0 var(--sp-3);
    border-radius: var(--radius-md); border: 1px solid var(--border-strong);
    background: var(--bg-elevated); color: var(--ink); font-size: var(--fs-base); font-family: var(--font-ui);
  }
  textarea { padding: var(--sp-3); min-height: 88px; font-family: var(--font-ui); resize: vertical; }
  input[type=text]:focus, select:focus, textarea:focus { border-color: var(--accent); }
  input[type=checkbox] { width:20px; height:20px; accent-color: var(--accent); flex:none; }

  /* ============ Plate control ============ */
  .plate {
    display:inline-flex; align-items:stretch; border-radius: var(--radius-sm);
    border: 2px solid var(--plate-border); overflow:hidden; background: var(--plate-bg);
    box-shadow: var(--shadow-1);
  }
  .plate .band {
    background: var(--plate-band); color: var(--plate-band-ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 6px 8px; font-family: var(--font-mono); font-size: 10px; font-weight:700; letter-spacing:.03em;
  }
  .plate .band .stars { font-size: 8px; line-height:1; letter-spacing:1px; }
  .plate .band.band-CH { background:#DA291C; color:#fff; }
  .plate .band.band-GB { background:#00247B; color:#fff; }
  /* Fixer (nicht theme-abhängiger) Farbwert statt --ink-faint: der Band-Text steht immer auf dem
     hellen --plate-ink, --ink-faint liegt im Dark Mode nur bei ~3.6:1 Kontrast dagegen (WCAG AA
     für Fließtext braucht 4.5:1) — mit #C2C9CB sind es durchgängig >10:1. */
  .plate .band.band-unknown { background: #C2C9CB; color: var(--plate-ink); }
  .plate .code {
    font-family: var(--font-mono); font-weight: 700; letter-spacing: .07em;
    color: var(--plate-ink); display:flex; align-items:center; padding: 0 var(--sp-3);
    font-size: var(--fs-lg); background: var(--plate-bg);
  }
  .plate.plate-lg .code { font-size: var(--fs-xl); padding: 0 var(--sp-4); min-height: 56px; }
  .plate.plate-lg .band { padding: 8px 10px; font-size: 11px; }
  .plate-input-shell { display:flex; border-radius: var(--radius-sm); overflow:hidden; border:2px solid var(--plate-border); }
  .plate-input-shell .band { border:none; }
  .plate-input-shell input {
    border:none; border-radius:0; background: var(--plate-bg); color: var(--plate-ink);
    font-family: var(--font-mono); font-weight:700; letter-spacing:.08em; font-size: var(--fs-md);
    text-transform:uppercase; min-height: 52px;
  }
  .plate-input-shell input::placeholder { color: #9a9d95; font-weight:600; letter-spacing:.04em; }
  .plate-input-shell input:focus { outline:none; box-shadow: inset 0 0 0 2px var(--accent); }
  .ambig-hint { display:none; font-size: var(--fs-2xs); color: var(--accent-strong); margin: 6px 0 0; }

  /* ============ Chips / badges ============ */
  .chip {
    display:inline-flex; align-items:center; gap:6px; padding: 5px 10px; border-radius: var(--radius-pill);
    font-size: var(--fs-2xs); font-weight:700; letter-spacing:.02em; border:1px solid transparent;
  }
  .chip-positive { background: var(--positive-soft); color: var(--positive); }
  .chip-neutral { background: var(--neutral-cat-soft); color: var(--neutral-cat); }
  .chip-negative { background: var(--negative-soft); color: var(--negative); }
  .chip-severe { background: var(--negative-severe-soft); color: var(--negative-severe); }
  .chip-muted { background: var(--bg-sunken); color: var(--ink-muted); }
  .chip-private { background: var(--bg-sunken); color: var(--ink-muted); }
  .chip-public { background: var(--accent-soft); color: var(--accent-strong); }

  /* ============ Category grid ============ */
  .cat-grid { display:grid; grid-template-columns: repeat(2,1fr); gap: var(--sp-3); }
  @media (max-width:560px){ .cat-grid{ grid-template-columns: 1fr; } }
  .cat-card {
    text-align:left; border-radius: var(--radius-md); border: 1.5px solid var(--border);
    background: var(--bg-elevated); padding: var(--sp-3) var(--sp-4); cursor:pointer;
    display:flex; flex-direction:column; gap: 4px; min-height: 64px; justify-content:center;
  }
  .cat-card:hover { border-color: var(--border-strong); background: var(--bg-sunken); }
  .cat-card.selected.type-positiv { border-color: var(--positive); background: var(--positive-soft); }
  .cat-card.selected.type-neutral { border-color: var(--neutral-cat); background: var(--neutral-cat-soft); }
  .cat-card.selected.type-negativ { border-color: var(--negative); background: var(--negative-soft); }
  .cat-card .cat-label { font-weight:700; font-size: var(--fs-sm); }
  .cat-card .cat-level { font-size: var(--fs-2xs); color: var(--ink-muted); }

  /* ============ Score gauge ============ */
  .score-block { display:flex; align-items:center; gap: var(--sp-5); flex-wrap:wrap; }
  .score-number { font-family: var(--font-mono); font-size: var(--fs-2xl); font-weight:700; letter-spacing:-.02em; }
  .score-ring { flex: none; }
  .disclaimer {
    display:flex; gap:10px; align-items:flex-start; background: var(--bg-sunken);
    border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--sp-3);
    font-size: var(--fs-xs); color: var(--ink-muted);
  }
  .disclaimer svg { flex:none; margin-top:1px; }

  .bar-row { display:grid; grid-template-columns: 168px 1fr auto; align-items:center; gap: var(--sp-3); font-size: var(--fs-xs); }
  @media (max-width:560px){ .bar-row{ grid-template-columns: 110px 1fr auto; } }
  .bar-track { height: 8px; border-radius: var(--radius-pill); background: var(--bg-sunken); overflow:hidden; }
  .bar-fill { height:100%; border-radius: var(--radius-pill); }

  .steps { display:flex; gap: 6px; margin-bottom: var(--sp-4); }
  .steps .seg { height:4px; flex:1; border-radius:2px; background: var(--border); }
  .steps .seg.done { background: var(--accent); }

  .callout {
    border-radius: var(--radius-md); border: 1px solid var(--border); padding: var(--sp-4);
    background: var(--bg-sunken); font-size: var(--fs-sm);
  }
  .callout.warn { border-color: var(--negative); background: var(--negative-soft); color: var(--negative); }
  .callout.info { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }

  .toast {
    position: fixed; bottom: var(--sp-5); left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: var(--radius-md);
    font-size: var(--fs-sm); font-weight:600; box-shadow: var(--shadow-2); z-index: 60;
    opacity:0; pointer-events:none; transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity:1; transform: translateX(-50%) translateY(-4px); }

  .modal-backdrop {
    position: fixed; inset:0; background: rgba(10,12,14,.5); display:flex; align-items:center; justify-content:center;
    padding: var(--sp-4); z-index: 50;
  }
  .modal {
    background: var(--bg-elevated); border-radius: var(--radius-lg); box-shadow: var(--shadow-2);
    max-width: 460px; width:100%; padding: var(--sp-5); max-height: 86vh; overflow-y:auto;
  }

  .review-item { border-left: 3px solid var(--accent); padding-left: var(--sp-3); }
  .kv { display:flex; justify-content:space-between; gap: var(--sp-3); font-size: var(--fs-xs); color: var(--ink-muted); padding: 6px 0; border-bottom: 1px solid var(--border); }
  .kv:last-child { border-bottom:none; }
  details.helpbox summary { cursor:pointer; font-weight:700; }
  details.helpbox[open] summary { margin-bottom: var(--sp-3); }
  hr.hair { border:none; border-top:1px solid var(--border); margin: var(--sp-5) 0; }

  .link-list a { display:block; padding: 10px 0; border-bottom: 1px solid var(--border); text-decoration:none; color:var(--ink); font-weight:600; }
  .link-list a:hover { color: var(--accent); }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<div class="app-shell">

ZE","ZEL","ZI","ZIG","ZP","ZR","ZS","ZW","ZZ","ÖHR","ÜB"];
  var ORTSCODE_SET = {};
  ORTSCODES.forEach(function(c){ ORTSCODE_SET[c] = true; });

  // Nach FZV §9 / Verwaltungsvorschrift zur Vermeidung von NS-Bezügen unerwünschte Buchstabenpaare
  // (bundesweite Empfehlung; regional zusätzlich gesperrte Kombinationen wie "S ED" oder "N PD"
  // sind hier bewusst nicht abgebildet, da sie je Zulassungsbezirk unterschiedlich sind).
  var FORBIDDEN_LETTER_COMBOS = { HJ:1, KZ:1, NS:1, SA:1, SS:1 };

  function normalizePlate(input){
    return (input||"").toUpperCase().replace(/[^A-Z0-9ÄÖÜ]/g,"");
  }
  function formatPlateDisplay(input){
    var v = (input||"").toUpperCase().trim().replace(/\s+/g," ");
    return v;
  }

  // Falls der Nutzer beim Tippen bereits getrennt hat ("M-RX 1234" / "M RX 1234"), liefert das
  // die Länge des vermutlichen Ortscodes als Hinweis — reduziert Mehrdeutigkeit beim Parsen.
  function ortscodeHintLength(rawInput){
    var m = (rawInput||"").toUpperCase().match(/^([A-ZÄÖÜ]{1,3})[\s\-]/);
    return m ? m[1].length : null;
  }

  // Prüft ein normalisiertes Kennzeichen gegen die echte Struktur deutscher Kfz-Kennzeichen:
  // Unterscheidungszeichen (offizielle Liste) + Erkennungsnummer (1-2 Buchstaben ohne Umlaute,
  // 1-4 Ziffern ohne führende Null), insgesamt max. 8 Zeichen (7 bei E-/H-Kennzeichen-Suffix),
  // keine verbotene Buchstabenkombination.
  // Bewertet EINEN konkreten Split (Ortscode-Länge codeLen) bis zum Ende durch — liefert entweder
  // ok:true oder eine konkrete Fehlerbegründung. Reinterpretiert bei einem Fehlschlag NICHT auf
  // einen anderen Split (das würde z.B. eine verbotene Kombination wie "M SS 1234" durch die
  // Alternative "MS S 1234" umgehen, obwohl der Nutzer klar "M" + "SS" getrennt hat).
  function evaluateSplitDE(norm, codeLen){
    var code = norm.slice(0, codeLen);
    if (!ORTSCODE_SET[code]) return { ok:false, reason:"unknown_ortscode", message:"Unbekanntes Unterscheidungszeichen (Ortscode) — bitte prüfen." };
    var rest = norm.slice(codeLen);
    var m = rest.match(/^([A-Z]{1,2})([1-9][0-9]{0,3})([EH])?$/);
    if (!m) return { ok:false, reason:"badnumber", message:"Erkennungsnummer ungültig — 1–2 Buchstaben und 1–4 Ziffern ohne führende Null erwartet." };
    var letters = m[1], digits = m[2], suffix = m[3] || null;
    if (letters.length === 2 && FORBIDDEN_LETTER_COMBOS[letters]) {
      return { ok:false, reason:"forbidden", message:"Diese Buchstabenkombination wird nicht vergeben." };
    }
    var totalLen = code.length + letters.length + digits.length;
    if (totalLen > (suffix ? 7 : 8)) {
      return { ok:false, reason:"toolong", message:"Kennzeichen ist zu lang (inkl. Ortscode max. 8 Zeichen, mit E/H-Kennzeichnung max. 7)." };
    }
    return { ok:true, ortscode:code, letters:letters, digits:digits, suffix:suffix };
  }

  function evaluatePlateDE(norm, rawInput){
    if (!norm) return { ok:false, reason:"empty", message:"Bitte ein Kennzeichen eingeben." };
    if (norm.length < 3 || norm.length > 8) {
      return { ok:false, reason:"length", message:"Kennzeichen hat eine ungültige Länge (3–8 Zeichen erwartet)." };
    }

    // Hat der Nutzer explizit getrennt (Leerzeichen/Bindestrich) und ist der so markierte Ortscode
    // real, gilt dieser Split als bindend — kein stilles Ausweichen auf eine andere Aufteilung.
    var hint = ortscodeHintLength(rawInput);
    if (hint && norm.length > hint && ORTSCODE_SET[norm.slice(0, hint)]) {
      return evaluateSplitDE(norm, hint);
    }

    // vollständig gültige Deutung akzeptieren; ohne Trennzeichen ist die Eingabe grundsätzlich
    // mehrdeutig, daher genügt eine erlaubte Lesart.
    var attempts = [];
    for (var codeLen=1; codeLen<=3; codeLen++) {
      if (norm.length <= codeLen) continue;
      if (!ORTSCODE_SET[norm.slice(0, codeLen)]) continue;
      attempts.push(evaluateSplitDE(norm, codeLen));
    }
    for (var i=0; i<attempts.length; i++) {
      if (attempts[i].ok) return attempts[i];
    }
    return attempts.length ? attempts[0] : { ok:false, reason:"unknown_ortscode", message:"Unbekanntes Unterscheidungszeichen (Ortscode) — bitte prüfen." };

  // ---------- Österreich (AT) ----------
  // Kennbuchstaben (Bezirks-/Behörden-/Sachbereichskennzeichen), Auszug von 122 Codes aus
  // de.wikipedia.org/wiki/Kfz-Kennzeichen_(Österreich), Abschnitt "Bezirks-, Behörden- und
  // Sachbereichskennbuchstaben" (aus dem Artikel-Quelltext geparst). Nicht aus dem Gedächtnis
  // rekonstruiert; vor Produktiveinsatz gegen die aktuelle Quelle re-verifizieren.
  var AT_KENNBUCHSTABEN = ["A","AM","B","BA","BB","BD","BG","BH","BL","BM","BN","BP","BR","BZ","DL","DO","E","EF","EU","FB","FE","FF","FK","FR","FV","FW","G","GB","GD","GF","GM","GR","GS","GU","HA","HB","HE","HF","HL","HO","I","IL","IM","JE","JO","JU","JW","K","KB","KF","KG","KI","KL","KO","KR","KS","KU","L","LA","LB","LE","LF","LI","LL","LN","LZ","MA","MD","ME","MI","MT","MU","MZ","N","ND","NK","O","OP","OW","P","PE","PL","PT","RA","RE","RI","RO","S","SB","SD","SE","SL","SO","SP","SR","ST","SV","SW","SZ","T","TA","TU","UU","V","VB","VI","VK","VL","VO","W","WB","WE","WL","WN","WO","WT","WU","WY","WZ","ZE","ZT","ZW"];
  var AT_KENNBUCHSTABEN_SET = {};
  AT_KENNBUCHSTABEN.forEach(function(c){ AT_KENNBUCHSTABEN_SET[c] = true; });

  // Bewertet Kennbuchstabe (1-2 Zeichen, längster gültiger Treffer zuerst) + Vormerkzeichen
  // (Ziffernblock gefolgt von Buchstabenblock — muss mit Ziffer beginnen und mit Buchstabe enden,
  // kein "Q", keine Umlaute; die Sonderregel für institutionelle Kennzeichen mit führender "0"/"O"
  // ist hier bewusst nicht abgebildet).
  function evaluatePlateAT(norm, rawInput){
    if (!norm) return { ok:false, reason:"empty", message:"Bitte ein Kennzeichen eingeben." };
    if (norm.length < 4 || norm.length > 9) {
      return { ok:false, reason:"length", message:"Kennzeichen hat eine ungültige Länge (4–9 Zeichen erwartet)." };
    }
    var attempts = [];
    for (var codeLen=2; codeLen>=1; codeLen--) {
      if (norm.length <= codeLen) continue;
      var code = norm.slice(0, codeLen);
      if (!AT_KENNBUCHSTABEN_SET[code]) continue;
      var rest = norm.slice(codeLen);
      // Einbuchstabige Kennbuchstaben (Landeshauptstädte, z. B. "W") erlauben einen Ziffer-Block mehr
      // (bis zu 5 statt 4 Stellen) — die Gesamtlänge des Vormerkzeichens bleibt dadurch vergleichbar.
      var maxDigits = codeLen === 1 ? 5 : 4;
      var digitsRe = new RegExp("^([1-9][0-9]{0,"+(maxDigits-1)+"})([A-PR-Z]{1,3})$");
      var m = rest.match(digitsRe); // kein Q, kein führendes O im Buchstabenblock
      if (!m) { attempts.push({ ok:false, reason:"badnumber", message:"Vormerkzeichen ungültig — Ziffernblock (ohne führende Null) gefolgt von Buchstabenblock (kein „Q“, kein führendes „O“) erwartet." }); continue; }
      attempts.push({ ok:true, ortscode:code, digits:m[1], letters:m[2], country:"AT" });
    }
    for (var i=0;i<attempts.length;i++){ if (attempts[i].ok) return attempts[i]; }
    return attempts.length ? attempts[0] : { ok:false, reason:"unknown_ortscode", message:"Unbekannter Kennbuchstabe — bitte prüfen." };
  }

  // ---------- Frankreich (FR) ----------
  // Seit 15. April 2009 gilt bundesweit einheitlich das Muster AA-123-AA (2 Buchstaben, 3 Ziffern
  // mit Pflicht-führenden-Nullen, 2 Buchstaben) — keine Ortsbindung mehr (Quelle:
  // de.wikipedia.org/wiki/Kfz-Kennzeichen_(Frankreich)). Reservierte Sonderserien (Händler "W…",
  // Kurzzeitkennzeichen "WW…") sind strukturell gültige Kennzeichen und werden hier nicht als
  // Fehler behandelt, ebenso wenig einzelne Buchstabenausschlüsse (z. B. Vokale) — dafür liegt
  // keine belastbare Quelle vor, die Prüfung bleibt bewusst rein strukturell.
  function evaluatePlateFR(norm, rawInput){
    if (!norm) return { ok:false, reason:"empty", message:"Bitte ein Kennzeichen eingeben." };
    var m = norm.match(/^([A-Z]{2})([0-9]{3})([A-Z]{2})$/);
    if (!m) return { ok:false, reason:"format", message:"Format erwartet: 2 Buchstaben – 3 Ziffern – 2 Buchstaben (z. B. AB-123-CD)." };
    return { ok:true, letters1:m[1], digits:m[2], letters2:m[3], country:"FR" };
  }

  // ---------- Schweiz (CH) ----------
  // Kontrollschild: zweistelliger Kantonscode + bis zu 6 Ziffern, an den Halter gebunden (nicht ans
  // Fahrzeug). Quelle: de.wikipedia.org/wiki/Kontrollschild_(Schweiz). Die 26 Kantonscodes sind
  // gesetzlich fixiert und allgemein bekannt (kein Wandel seit Einführung).
  var CH_CANTONS = {AG:1,AI:1,AR:1,BE:1,BL:1,BS:1,FR:1,GE:1,GL:1,GR:1,JU:1,LU:1,NE:1,NW:1,OW:1,SG:1,SH:1,SO:1,SZ:1,TG:1,TI:1,UR:1,VD:1,VS:1,ZG:1,ZH:1};
  function evaluatePlateCH(norm, rawInput){
    if (!norm) return { ok:false, reason:"empty", message:"Bitte ein Kennzeichen eingeben." };
    var m = norm.match(/^([A-Z]{2})([1-9][0-9]{0,5})$/);
    if (!m) return { ok:false, reason:"format", message:"Format erwartet: Kantonskürzel + bis zu 6 Ziffern ohne führende Null (z. B. ZH 123456)." };
    if (!CH_CANTONS[m[1]]) return { ok:false, reason:"unknown_canton", message:"Unbekanntes Kantonskürzel — bitte prüfen." };
    return { ok:true, canton:m[1], digits:m[2], country:"CH" };
  }

  // ---------- Vereinigtes Königreich (GB) ----------
  // Aktuelles System seit 2001: 2 Buchstaben Gebietscode + 2 Ziffern Alterskennung (wechselt im
  // März/September) + 3 zufällige Buchstaben, "I" und "Q" werden in keiner Buchstabenposition
  // vergeben (Verwechslungsgefahr mit 1/0). Quelle: en.wikipedia.org/wiki/Vehicle_registration_
  // plates_of_the_United_Kingdom. Die genaue gültige Alterskennungs-Zahl je Halbjahr sowie
  // gesperrte "anstößige" Buchstabenkombinationen werden hier nicht geprüft (strukturell only).
  function evaluatePlateGB(norm, rawInput){
    if (!norm) return { ok:false, reason:"empty", message:"Bitte ein Kennzeichen eingeben." };
    var m = norm.match(/^([A-Z]{2})([0-9]{2})([A-Z]{3})$/);
    if (!m) return { ok:false, reason:"format", message:"Format erwartet: 2 Buchstaben – 2 Ziffern – 3 Buchstaben, ohne „I“/„Q“ (z. B. AB12 CDE)." };
    if (/[IQ]/.test(m[1]+m[3])) return { ok:false, reason:"letters", message:"„I“ und „Q“ werden in keiner Buchstabenposition vergeben." };
    return { ok:true, area:m[1], age:m[2], random:m[3], country:"GB" };
  }

  // ---------- Sonstiges EU-/EWR-Land (generischer Fallback) ----------
  // Für nicht einzeln modellierte EU-/EWR-Länder wird nur die grobe Euro-Kennzeichen-Form geprüft
  // (Länge, alphanumerisch, mindestens eine Ziffer) — bewusst kein Vortäuschen einer echten
  // länderspezifischen Regel, die nicht verifiziert wurde (Spec §14.9: Rest-EU pauschal, DE/AT/FR/
  // CH/GB einzeln echt geprüft).
  function evaluatePlateEUGeneric(norm, rawInput){
    if (!norm) return { ok:false, reason:"empty", message:"Bitte ein Kennzeichen eingeben." };
    if (norm.length < 2 || norm.length > 10) {
      return { ok:false, reason:"length", message:"Kennzeichen hat eine ungültige Länge (2–10 Zeichen erwartet)." };
    }
    if (!/^[A-Z0-9]+$/.test(norm)) {
      return { ok:false, reason:"chars", message:"Nur Buchstaben und Ziffern sind erlaubt." };
    }
    if (!/[0-9]/.test(norm)) {
      return { ok:false, reason:"nodigit", message:"Ein EU-Kennzeichen enthält üblicherweise mindestens eine Ziffer." };
    }
    return { ok:true, country:"EU" };
  }

  var COUNTRIES = [
    {code:"DE", label:"Deutschland", band:"D", stars:true},
    {code:"AT", label:"Österreich", band:"A", stars:true},
    {code:"FR", label:"Frankreich", band:"F", stars:true},
    {code:"CH", label:"Schweiz", band:"CH", stars:false},
    {code:"GB", label:"Vereinigtes Königreich", band:"GB", stars:false},
    {code:"EU", label:"Anderes EU-/EWR-Land", band:"EU", stars:true}
  ];
  var COUNTRY_BY_CODE = {};
  COUNTRIES.forEach(function(c){ COUNTRY_BY_CODE[c.code] = c; });

  // Zentrale Weiche: leitet an die länderspezifische Prüfung weiter (Spec §14.9 — Deutschland,
  // EU/EWR, UK und Schweiz sind separate Rechtsräume mit eigener Formatlogik).
  function evaluatePlate(norm, rawInput, country){
    switch (country || "DE") {
      case "DE": return evaluatePlateDE(norm, rawInput);
      case "AT": return evaluatePlateAT(norm, rawInput);
      case "FR": return evaluatePlateFR(norm, rawInput);
      case "CH": return evaluatePlateCH(norm, rawInput);
      case "GB": return evaluatePlateGB(norm, rawInput);
      default: return evaluatePlateEUGeneric(norm, rawInput);
    }
  }

  // Reihenfolge, in der Länder beim automatischen Erkennen probiert werden. DE zuerst als
  // bewusster Home-Market-Bias (Zielgruppe MVP), danach die anderen echt geprüften Länder;
  // der generische EU-Fallback läuft immer zuletzt, weil er am lockersten ist und sonst
  // spezifischere Treffer verdecken würde. Bei mehrdeutigen Eingaben (z. B. "ZH123" liest sich
  // sowohl als DE-Ortscode "Z"+"H123" als auch als CH-Kanton "ZH"+"123") gewinnt diese Reihenfolge
  // ohne Rückfrage — bewusste Entscheidung für Tempo statt einer zusätzlichen Länderauswahl.
  var DETECT_ORDER = ["DE","AT","FR","CH","GB"];

  function detectCountry(rawInput){
    var norm = normalizePlate(rawInput);
    if (!norm) return { ok:false, reason:"empty", message:"Bitte ein Kennzeichen eingeben." };
    var matches = [];
    for (var i=0;i<DETECT_ORDER.length;i++){
      var cc = DETECT_ORDER[i];
      var r = evaluatePlate(norm, rawInput, cc);
      if (r.ok) matches.push({ country:cc, result:r });
    }
    if (matches.length) {
      return { ok:true, country: matches[0].country, result: matches[0].result, ambiguous: matches.length>1 };
    }
    var euR = evaluatePlateEUGeneric(norm, rawInput);
    if (euR.ok) return { ok:true, country:"EU", result: euR, ambiguous:false };
    return { ok:false, reason:"unrecognized", message:"Kennzeichenformat nicht erkannt — passt zu keinem hinterlegten Länderschema (DE/AT/FR/CH/GB) und auch nicht zum groben EU-Format." };
  }

  function getPlate(norm){ return state.plates[norm]; }

  // SHA-256(country_code + normalizedPlate), hex-codiert. Muss für dasselbe Kennzeichen IMMER
  // denselben Wert liefern, egal wer/wann/wo aufruft, sonst duplizieren sich Kennzeichen in der DB
  // unsichtbar. Deshalb country IMMER frisch aus detectCountry() ableiten lassen, NIE aus einem
  // schon geladenen Mirror-Eintrag übernehmen (siehe supabase/migrations/0004_functions.sql -
  // die DB nimmt entgegen, was der Client schickt und verlässt sich nicht auf eine eigene Prüfung).
  function plateLookupHash(norm, country){
    var input = (country || "DE") + norm;
    var data = new TextEncoder().encode(input);
    return crypto.subtle.digest("SHA-256", data).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2, "0"); }).join("");
    });
  }

  // Bildet die JSON-Antwort von get_plate_profile() (0004_functions.sql) auf die Feldnamen ab, die
  // renderProfile() erwartet. Die Funktion ist die einzige RoadScore-Quelle (SSOT, computeAggregate()
  // wurde mit Phase 6.5 entfernt).
  function mapPlateProfile(data){
    if (!data.visible) {
      return { loaded: true, visible: false, reason: data.reason, display: data.display_plate || null, country: data.country_code || null };
    }
    return {
      loaded: true, visible: true, tier: data.tier, isActualOwner: !!data.is_actual_owner,
      id: data.id, display: data.display_plate, country: data.country_code,
      publicOptIn: data.public_opt_in, publicOptInAt: data.public_opt_in_at,
      verified: data.verified, moderationHidden: data.moderation_hidden, moderationBlocked: data.moderation_blocked,
      agg: {
        score: data.score, enoughData: data.enough_data, trust: data.trust,
        accountCount: data.account_count, validCount: data.valid_count, totalCount: data.total_count,
        dist: data.dist || { positiv: 0, neutral: 0, negativ: 0 }, topCats: data.top_cats || [], periodDays: data.period_days
      }
    };
  }

  var plateFetchInFlight = {};

  // viewResult()/viewRate()/viewMyPlate() sind synchron (Router-Konvention aus render()), aber
  // get_plate_profile() ist ein async DB-Aufruf. Statt render() komplett auf async umzubauen: einmalig
  // nachladen und render() erneut anstoßen, sobald die Antwort da ist - der zweite, synchrone
  // render()-Durchlauf liest dann aus dem gefüllten Mirror (state.plates). force=true erzwingt ein
  // Neuladen im Hintergrund (z. B. direkt nach einem eigenen Schreibzugriff), zeigt aber bis dahin noch
  // den alten Stand, um kein Lade-Flackern zu erzeugen.
  function ensurePlateLoaded(norm, country, force){
    var entry = state.plates[norm];
    if (entry && entry.loaded && !force) return entry;
    if (!plateFetchInFlight[norm]) {
      plateFetchInFlight[norm] = plateLookupHash(norm, country).then(function(hash){
        return db.rpc("get_plate_profile", { p_lookup_hash: hash }).then(function(res){
          if (res.error) throw res.error;
          var mapped = mapPlateProfile(res.data);
          mapped.hash = hash;
          state.plates[norm] = mapped;
        });
      }).catch(function(err){
        state.plates[norm] = { loaded: true, visible: false, reason: "error", errorMessage: (err && err.message) || String(err) };
      }).then(function(){
        delete plateFetchInFlight[norm];
        render();
      });
    }
    return entry || { loaded: false };
  }

  var userPlatePreview = {};
  var previewFetchInFlight = {};

  // Freundesliste + Einladungslink (Phase 6.4) brauchen "welches Kennzeichen gehört zu dieser
  // User-ID", OHNE dass schon eine (gegenseitige) Freundschaft besteht - genau das liefert
  // get_invite_preview() (0006_friend_invite_preview.sql), absichtlich nur display_plate+country_code,
  // kein Score. Gleiches Nachlade-Muster wie ensurePlateLoaded(), nur nach User-ID statt Kennzeichen-Norm
  // gecacht.
  function ensureUserPreviewLoaded(userId){
    var entry = userPlatePreview[userId];
    if (entry && entry.loaded) return entry;
    if (!previewFetchInFlight[userId]) {
      previewFetchInFlight[userId] = db.rpc("get_invite_preview", { p_user_id: userId }).then(function(res){
        if (res.error) throw res.error;
        userPlatePreview[userId] = res.data.found
          ? { loaded: true, found: true, display: res.data.display_plate, country: res.data.country_code }
          : { loaded: true, found: false };
      }).catch(function(err){
        userPlatePreview[userId] = { loaded: true, found: false, errorMessage: (err && err.message) || String(err) };
      }).then(function(){
        delete previewFetchInFlight[userId];
        render();
      });
    }
    return entry || { loaded: false };
  }

  // Gegenseitig = beide Richtungen existieren in friendLinks (from→to UND to→from). Einseitig
  // hinzugefügt reicht bewusst NICHT — sonst könnte man sich ohne Zustimmung der Gegenseite Zugriff
  // auf ein privates Profil verschaffen.
  function isMutualFriend(otherAccountId){
    if (!otherAccountId || otherAccountId === state.currentUser.id) return false;
    var links = state.friendLinks || [];
    var out = links.some(function(l){ return l.from===state.currentUser.id && l.to===otherAccountId; });
    var back = links.some(function(l){ return l.from===otherAccountId && l.to===state.currentUser.id; });
    return out && back;
  }

  // apply_moderation_decision() (0004_functions.sql), nicht mehr per lokalem Array-Push.
  var MOD_ACTION_LABELS = {
    dismiss: "Kein Verstoß — Fall geschlossen",

    unhide: "Verbergen aufgehoben",
    escalate: "Eskaliert",

  // Lädt alle Fälle EINMAL mit dem zugehörigen Kennzeichen-Snapshot (Embed über die plate_id-FK -
  // plates_select_moderator, 0003_rls.sql, erlaubt das inkl. gesperrter/verborgener Kennzeichen). Gleiches
  // Nachlade-Muster wie ensurePlateLoaded()/ensureUserPreviewLoaded(): force=true erzwingt ein Neuladen im
  // Hintergrund (z. B. nach der eigenen Entscheidung), zeigt aber bis dahin den alten Stand.
  function ensureModerationCasesLoaded(force){
    if (moderationCasesCache && !force) return moderationCasesCache;
    if (!moderationCasesFetchInFlight) {
      moderationCasesFetchInFlight = true;
      db.from("moderation_cases")
        .select("id,case_number,reason,description,reported_by,created_at,status,escalated,plate_id,plates(display_plate,country_code,moderation_hidden,moderation_blocked)")
        .order("created_at", { ascending: false })
        .then(function(res){
          if (res.error) throw res.error;
          moderationCasesCache = { loaded: true, list: res.data || [] };
        }).catch(function(err){
          moderationCasesCache = { loaded: true, list: [], errorMessage: (err && err.message) || String(err) };
        }).then(function(){
          moderationCasesFetchInFlight = false;
          render();
        });
    }
    return moderationCasesCache || { loaded: false };
  }

  var moderationDecisionsCache = {};
  var moderationDecisionsFetchInFlight = {};

  // Audit-Protokoll (moderation_actions) je Fall separat nachgeladen statt beim Fälle-Laden mitgezogen -
  // wird nur gebraucht, wenn ein Fall tatsächlich geöffnet wird (viewModerationCase()).
  function ensureModerationDecisionsLoaded(caseId, force){
    var entry = moderationDecisionsCache[caseId];
    if (entry && entry.loaded && !force) return entry;
    if (!moderationDecisionsFetchInFlight[caseId]) {
      moderationDecisionsFetchInFlight[caseId] = db.from("moderation_actions")
        .select("id,actor_user_id,action,note,acted_at")
        .eq("case_id", caseId)
        .order("acted_at", { ascending: false })
        .then(function(res){
          if (res.error) throw res.error;
          moderationDecisionsCache[caseId] = { loaded: true, list: res.data || [] };
        }).catch(function(err){
          moderationDecisionsCache[caseId] = { loaded: true, list: [], errorMessage: (err && err.message) || String(err) };
        }).then(function(){
          delete moderationDecisionsFetchInFlight[caseId];
          render();
        });
    }
    return entry || { loaded: false };
  }

  function h(tag, attrs, children){
    attrs = attrs || {};
    var parts = ["<"+tag];
    Object.keys(attrs).forEach(function(k){
      if (attrs[k]===false || attrs[k]==null) return;
      parts.push(" "+k+'="'+String(attrs[k]).replace(/"/g,"&quot;")+'"');
    });
    parts.push(">");
    if (children!=null) parts.push(children);
    if (!["input","br","hr"].includes(tag)) parts.push("</"+tag+">");
    return parts.join("");
  }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  var toastTimer = null;
  function toast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);

  }

  // Statischer (nicht editierbarer) Länder-Band für Anzeigekontexte (Ergebnis, Bewerten-Header, ...).
  function plateBandStatic(country){
    var c = COUNTRY_BY_CODE[country] || COUNTRY_BY_CODE.DE;
    return '<span class="band band-'+c.code+'"><span>'+c.band+'</span>' +
      (c.stars ? '<span class="stars">★★★</span>' : '') + '</span>';
  }

  // Nicht editierbarer Länder-Band für die drei Kennzeichen-Eingabefelder (Suche, Bewerten, Mein
  // Kennzeichen). Das Land wird nicht mehr ausgewählt, sondern beim Tippen live per detectCountry()
  // erkannt (updateAutoBand) — Startzustand ist "unbekannt" (?), bis genug Zeichen für einen
  // eindeutigen Formattreffer eingegeben wurden.
  function plateBandAuto(bandId){
    return '<span class="band band-unknown" id="'+bandId+'"><span aria-hidden="true">?</span>' +
      '<span class="sr-only band-sr-text">Erkanntes Land: noch unbekannt</span></span>';
  }

  // Aktualisiert Bandfarbe/-kürzel/Sterne live beim Tippen, sobald detectCountry() ein Land
  // erkennt — das ist die einzige Rückmeldung, ob die Auto-Erkennung richtig geraten hat, deshalb
  // läuft sie bei jedem input-Event, nicht erst beim Absenden.
  function updateAutoBand(bandEl, rawValue, hintEl){
    var srText = '<span class="sr-only band-sr-text">Erkanntes Land: ';
    if (!rawValue || !rawValue.trim()) {
      bandEl.className = "band band-unknown";
      bandEl.innerHTML = '<span aria-hidden="true">?</span>' + srText + 'noch unbekannt</span>';
      if (hintEl) hintEl.style.display = "none";
      return null;
    }
    var det = detectCountry(rawValue);
    if (det.ok) {
      var c = COUNTRY_BY_CODE[det.country];
      bandEl.className = "band band-" + c.code;
      bandEl.innerHTML = '<span aria-hidden="true">'+esc(c.band)+'</span>' +
        (c.stars ? '<span class="stars" aria-hidden="true">★★★</span>' : "") +
        srText + esc(c.label) + '</span>';
      // Mehrdeutig = mehr als ein Länderschema passt (z. B. "ZH123" liest sich als DE-Ortscode
      // "Z"+"H123" UND als CH-Kanton "ZH"+"123"). DETECT_ORDER entscheidet leise zugunsten von
      // Tempo (siehe Kommentar dort) — hier nur ein Hinweis, keine erneute Auswahl.
      if (hintEl) {
        hintEl.style.display = det.ambiguous ? "block" : "none";
        if (det.ambiguous) hintEl.textContent = "Mehrdeutig — \"" + rawValue.trim() + "\" könnte auch aus einem anderen Land stammen. Erkannt als " + c.label + ". Falsch? Ortscode/Kürzel wie auf dem Schild mit Leerzeichen oder Bindestrich abtrennen.";
      }
    } else {
      bandEl.className = "band band-unknown";
      bandEl.innerHTML = '<span aria-hidden="true">?</span>' + srText + 'nicht erkannt</span>';
      if (hintEl) hintEl.style.display = "none";
    }
    return det;
  }

  // Kennzeichen zeigt eine eigene, deutlichere Meldung statt der Verbergen-Meldung.
  function moderationStatusBanner(plateObj){

  function scoreRing(score, colorVar){
    var r = 40, c = 2*Math.PI*r;
    var pct = Math.max(0, Math.min(100, score))/100;
    var off = c*(1-pct);
    return '<svg class="score-ring" width="96" height="96" viewBox="0 0 96 96">'+
      '<circle cx="48" cy="48" r="'+r+'" fill="none" stroke="var(--border)" stroke-width="9"/>'+
      '<circle cx="48" cy="48" r="'+r+'" fill="none" stroke="'+colorVar+'" stroke-width="9" stroke-linecap="round" '+
        'stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 48 48)"/>'+
      '</svg>';
  }

  function scoreColorVar(score){
    if (score >= 65) return "var(--positive)";
    if (score <= 35) return "var(--negative)";
    return "var(--neutral-cat)";
  }

  function typeChipClass(type){ return type==="positiv"?"chip-positive":type==="negativ"?"chip-negative":"chip-neutral"; }
  function typeLabel(type){ return type==="positiv"?"Positiv":type==="negativ"?"Negativ":"Neutral"; }

  function distBar(dist){
    var total = (dist.positiv||0)+(dist.neutral||0)+(dist.negativ||0);
    if (!total) return '<p class="eyebrow">Keine Beobachtungen</p>';
    function seg(n, colorVar){
      var pct = Math.round(100*n/total);
      return pct>0 ? '<span style="flex:'+pct+'; background:'+colorVar+'; display:block; height:100%;"></span>' : "";
    }
    return '<div class="bar-track" style="height:10px; display:flex; overflow:hidden;">'+
      seg(dist.positiv,"var(--positive)")+seg(dist.neutral,"var(--neutral-cat)")+seg(dist.negativ,"var(--negative)")+
      '</div>'+
      '<div class="row" style="gap:var(--sp-4); margin-top:8px; font-size:var(--fs-2xs); color:var(--ink-muted);">'+
      '<span>● Positiv '+(dist.positiv||0)+'</span><span>● Neutral '+(dist.neutral||0)+'</span><span>● Negativ '+(dist.negativ||0)+'</span></div>';
  }

  function topCatRows(topCats, plateObj){
    if (!topCats.length) return "";
    var maxCount = topCats[0].count;
    return topCats.map(function(tc){
      var cat = catByKey[tc.key];
      var colorVar = cat.type==="positiv"?"var(--positive)":cat.type==="negativ"?"var(--negative)":"var(--neutral-cat)";
      var pct = Math.round(100*tc.count/maxCount);
      return '<div class="bar-row">'+
        '<span>'+esc(cat.label)+'</span>'+
        '<span class="bar-track"><span class="bar-fill" style="width:'+pct+'%; background:'+colorVar+';"></span></span>'+
        '<span class="tabular" style="color:var(--ink-muted)">'+tc.count+'</span></div>';
    }).join("");
  }

  function parseRoute(){
    // Query-String (z. B. "?claim=..." bei /myplate) gehört nicht zum Pfad — vor dem Zerlegen in
    // Segmente abschneiden, sonst matcht "myplate?claim=..." nie die Route "myplate".
    var h2 = location.hash.replace(/^#\/?/, "").split("?")[0];
    var parts = h2.split("/").filter(Boolean);
    return { route: parts[0] || "search", params: parts.slice(1) };
  }

  function render(){
    var content = document.getElementById("content");
    if (!state) {
      // Noch keine Session bootstrapped (nicht eingeloggt oder Bootstrap läuft noch) -> Login statt Router.
      document.getElementById("mainnav").innerHTML = "";
      content.innerHTML = viewLogin();
      wireLoginEvents();
      return;
    }
    var r = parseRoute();
    renderNav(r.route);
    var html = "";
    switch(r.route){
      case "search": html = viewSearch(); break;
      case "result": html = viewResult(decodeURIComponent(r.params[0]||"")); break;
      case "rate": html = viewRate(r.params[0] ? decodeURIComponent(r.params[0]) : null); break;
      case "myplate": html = viewMyPlate(); break;
      case "confirmed": html = viewConfirmed(); break;
      case "help": html = viewHelp(); break;
      case "moderation": html = state.currentUser.isModerator ? viewModeration(r.params[0] ? decodeURIComponent(r.params[0]) : null) : viewModerationDenied(); break;
      case "friend-invite": html = viewFriendInvite(r.params[0] ? decodeURIComponent(r.params[0]) : null); break;
      default: html = viewSearch();
    }
    content.innerHTML = html;
    wireContentEvents(r);
    window.scrollTo(0,0);
  }

        '<div class="start-hero">' +
          '<img class="start-icon" src="'+BRAND_ICON_SRC+'" alt="" width="72" height="72" />' +
          '<div><h1>Kennzeichen suchen</h1><p style="color:var(--ink-muted)">Nur exakte Treffer. Keine Teiltreffer, keine Liste, keine Vorschläge während der Eingabe.</p></div>' +
        '</div>' +
        '<div class="card stack">' +
          '<div>' +
            '<label class="field-label" for="plate-input">Kennzeichen</label>' +
            '<div class="plate-input-shell">' +
              plateBandAuto("plate-input-band") +
              '<input id="plate-input" type="text" placeholder="z. B. M RX 1234" autocomplete="off" maxlength="14" aria-describedby="plate-input-band plate-input-hint" />' +
            '</div>' +
            '<p class="ambig-hint" id="plate-input-hint" role="status"></p>' +
          '</div>' +
          '<div class="row" style="justify-content:flex-end; gap:var(--sp-3);">' +
            '<button class="btn btn-secondary" id="btn-goto-rate">Direkt bewerten</button>' +
            '<button class="btn btn-primary" id="btn-search">'+icon("search")+' Suchen</button>' +
          '</div>' +
        '</div>' +
        '<div class="callout info">' +
          'Ein Kennzeichen zeigt bewusst nichts, solange niemand es bewertet oder verifiziert hat — das ist Absicht, kein Bug. Bewerte oder verifiziere ein Kennzeichen selbst, um ein Profil zu sehen.' +
        '</div>' +
      '</div>';
  }

  function viewResult(rawInput){
    var norm = normalizePlate(rawInput);
    var display = formatPlateDisplay(rawInput);
    var det = detectCountry(rawInput);
    if (!det.ok) {
      return '<div class="stack"><h1>Ungültiges Kennzeichen</h1>' +
        '<div class="callout warn">„'+esc(rawInput)+'“ — '+esc(det.message)+'</div>' +
        '<a class="btn btn-secondary" href="#/search">Zurück zur Suche</a></div>';
    }

    // get_plate_profile() (0004_functions.sql) entscheidet Sichtbarkeit UND liefert den RoadScore in
    // einem Aufruf - Owner/Moderator vs. Freund vs. öffentlich vs. gar nicht wird jetzt serverseitig
    // per RLS-Kriterien bestimmt, nicht mehr hier im Client (isMutualFriend()/computeAggregate() entfallen
    // für diesen Pfad komplett).
    var entry = ensurePlateLoaded(norm, det.country);
    if (!entry.loaded) {
      return '<div class="stack"><h1>'+plateChip(display,"lg",det.country)+'</h1>' +
        '<div class="card stack"><p style="color:var(--ink-muted)">Lade Profil …</p></div></div>';
    }
    if (entry.reason === "error") {
      return '<div class="stack"><h1>'+plateChip(display,"lg",det.country)+'</h1>' +
        '<div class="callout warn">Profil konnte nicht geladen werden: '+esc(entry.errorMessage||"Unbekannter Fehler")+'</div>' +
        '<button class="btn btn-secondary" id="btn-retry-load" data-retry-plate="'+esc(norm)+'" data-retry-country="'+esc(det.country)+'">Erneut versuchen</button></div>';
    }

    if (entry.visible) {
      // tier "owner" schließt Moderator:innen mit ein (siehe is_actual_owner-Kommentar in
      // 0004_functions.sql) - nur der wirkliche Owner bekommt die private Ansicht mit Opt-in-Steuerung,
      // eine Moderationsperson bekommt eine eigene, klar erkennbare Ansicht ohne diese Steuerelemente.
      var visibility = entry.tier === "owner" ? (entry.isActualOwner ? "private" : "moderator") : entry.tier;
      var banner = (visibility === "private" || visibility === "moderator") ? moderationStatusBanner(entry) : "";
      return banner + renderProfile({
        norm: norm, display: entry.display || display, country: entry.country || det.country,
        agg: entry.agg, visibility: visibility, isOwner: entry.isActualOwner, publicOptIn: entry.publicOptIn
      });
    }

    // Privat, gesperrt, verborgen oder unbekannt: Flow A Schritt 6 — bewusst dieselbe Meldung für alle
    // diese Fälle (kein Hinweis, WARUM nichts sichtbar ist), sonst würde die Formulierung selbst schon
    // verraten, ob z. B. gerade ein Moderationsfall läuft.
    return '<div class="stack">' +
      '<h1>'+plateChip(display,"lg",entry.country||det.country)+'</h1>' +
      '<div class="card stack">' +
        '<p style="color:var(--ink-muted)">Für dieses Kennzeichen liegen keine öffentlich einsehbaren Informationen vor. Das gilt unabhängig davon, ob im Hintergrund bereits private Beobachtungen existieren — genau das ist der Datenschutz-Kern von RoadRep.</p>' +
        '<div class="row" style="gap:var(--sp-3); flex-wrap:wrap;">' +
          '<a class="btn btn-primary" href="#/rate/'+encodeURIComponent(display)+'">'+icon("rate")+' Fahrverhalten bewerten</a>' +
          '<a class="btn btn-secondary" href="#/myplate?claim='+encodeURIComponent(display)+'">Als mein Kennzeichen verifizieren</a>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function renderProfile(opts){
    var norm=opts.norm, display=opts.display, agg=opts.agg, visibility=opts.visibility, isOwner=opts.isOwner;
    var publicOptIn = !!opts.publicOptIn;
    var country = opts.country || "DE";
    var visChip = visibility==="public"
      ? '<span class="chip chip-public">'+icon("globe")+' Öffentlich freigegeben</span>'
      : visibility==="friend"
      ? '<span class="chip chip-positive">'+icon("friend")+' Nur für euch sichtbar — ihr seid gegenseitig verbunden</span>'
      : visibility==="moderator"
      ? '<span class="chip chip-muted">'+icon("lock")+' Moderationsansicht — für andere nicht sichtbar</span>'
      : '<span class="chip chip-private">'+icon("lock")+' Privat — nur für dich sichtbar'+(publicOptIn?' · zusätzlich öffentlich freigegeben':'')+'</span>';

    var scoreArea;
    if (!agg.enoughData) {
      // visChip fehlte hier bisher komplett: wer sein Profil öffentlich macht, BEVOR genug Daten
      // für einen Score vorliegen, bekam nirgends eine sichtbare Bestätigung — nur ein Toast, der
      // wieder verschwindet. Jetzt dieselbe Zeile wie im Score-Fall.
      scoreArea = '<div class="card stack">' +
        '<div class="row" style="justify-content:space-between; flex-wrap:wrap; gap:var(--sp-3);">' +
          '<p class="eyebrow" style="margin:0;">RoadScore</p>' + visChip +
        '</div>' +
        '<h2 style="margin:0;">Noch nicht genügend unabhängige Beobachtungen</h2>' +
        '<p style="color:var(--ink-muted); margin-bottom:0;">Mindestens '+MIN_OBS+' gültige Beobachtungen von '+MIN_ACCOUNTS+' unabhängigen Konten nötig. Aktuell: '+agg.validCount+' Beobachtung(en), '+agg.accountCount+' Konto(s).</p></div>';
    } else {
      scoreArea = '<div class="card stack">' +
        '<div class="row" style="justify-content:space-between; flex-wrap:wrap; gap:var(--sp-3);">' +
          '<p class="eyebrow" style="margin:0;">RoadScore · Vertrauensstufe: '+agg.trust+'</p>' + visChip +
        '</div>' +
        '<div class="score-block">' +
          '<div style="position:relative; width:96px; height:96px; display:flex; align-items:center; justify-content:center;">' +
            scoreRing(agg.score, scoreColorVar(agg.score)) +
            '<span class="score-number tabular" style="position:absolute;">'+agg.score+'</span>' +
          '</div>' +
          '<div style="flex:1; min-width:220px;">' + distBar(agg.dist) + '</div>' +
        '</div>' +
        disclaimerBlock() +
        '<p style="color:var(--ink-faint); font-size:var(--fs-2xs); margin:0;">Zeitraum: letzte '+agg.periodDays+' Tage · '+agg.validCount+' gültige Beobachtungen · '+agg.accountCount+' unabhängige Konten</p>' +
      '</div>';
    }

    var topArea = agg.topCats.length ? '<div class="card stack"><p class="eyebrow" style="margin:0;">Häufigste Kategorien</p>'+topCatRows(agg.topCats, null)+'</div>' : "";

    var optInArea = "";
    if (visibility==="private" && isOwner) {
      optInArea = '<div class="card stack">' +
        '<p class="eyebrow" style="margin:0;">Sichtbarkeit</p>' +
        '<p style="margin:0; color:var(--ink-muted);">Standardmäßig ist dein Profil privat. Du kannst es freiwillig und jederzeit widerruflich veröffentlichen (§8.6 der Spec).</p>' +
        (publicOptIn
          ? '<button class="btn btn-danger-ghost" id="btn-revoke-public">Öffentliche Freigabe beenden</button>'
          : '<button class="btn btn-secondary" id="btn-make-public">Profil öffentlich machen</button>') +
      '</div>';
    }

    var reportArea = '<button class="btn btn-ghost btn-sm" id="btn-report" data-plate="'+esc(norm)+'">Profil oder Ergebnis melden</button>';

    return '<div class="stack">' +
      '<div class="row" style="justify-content:space-between; flex-wrap:wrap; gap:var(--sp-3);">' +
        plateChip(display, "lg", country) +
        '<a class="btn btn-primary" href="#/rate/'+encodeURIComponent(display)+'">'+icon("rate")+' Fahrverhalten bewerten</a>' +
      '</div>' +
      scoreArea + topArea + optInArea +
      '<div>'+reportArea+'</div>' +
    '</div>';
  }

  /* ---------- View: Bewerten ---------- */
  function viewRate(prefillDisplay){
    if (prefillDisplay) {
      // Der Hash bleibt während des gesamten Ablaufs unverändert (Schritte laufen rein über rateCtx
      // + render()). Nur bei einem tatsächlichen Plattenwechsel zurücksetzen, sonst wird jede
      // interne Weiterschaltung (Typ-/Kategoriewahl) sofort wieder auf null zurückgesetzt.
      var norm = normalizePlate(prefillDisplay);
      if (rateCtx.plateNorm !== norm) {
        var existingPlate = getPlate(norm);
        var det = detectCountry(prefillDisplay);
        var detCountry = (existingPlate && existingPlate.country) || (det.ok ? det.country : "DE");
        rateCtx = { plateNorm: norm, country: detCountry, display: formatPlateDisplay(prefillDisplay), categoryKeys:[], step: 2 };
      }
    }
    if (!rateCtx.plateNorm) {
      return '<div class="stack"><h1>Fahrverhalten bewerten</h1>' +
        '<div class="card stack">' +
          '<p style="color:var(--ink-muted)">Für welches Kennzeichen möchtest du eine selbst beobachtete Situation bewerten?</p>' +
          '<div class="plate-input-shell">' +
            plateBandAuto("rate-plate-band") +
            '<input id="rate-plate-input" type="text" placeholder="z. B. K AB 550" autocomplete="off" maxlength="14" aria-describedby="rate-plate-band rate-plate-hint" />' +
          '</div>' +
          '<p class="ambig-hint" id="rate-plate-hint" role="status"></p>' +
          '<button class="btn btn-primary btn-block" id="btn-rate-continue">Weiter</button>' +
        '</div>' +
      '</div>';
    }

    var norm = rateCtx.plateNorm;

    // Gesperrt-Prüfung direkt hier, BEVOR die Schritte 2–4 (Typ/Kategorie/Bestätigung) überhaupt
    // gezeigt werden — so auch bei Direktlinks (#/rate/<plate>) abgedeckt, nicht nur beim manuellen
    // "Weiter". Läuft jetzt über denselben Remote-Fetch wie das Profil, deshalb erst nach dem ersten
    // render()-Durchlauf sichtbar (kurzes Zeitfenster ohne clientseitige Vorwarnung) - submit_observations()
    // erzwingt die Sperre server-seitig ohnehin unabhängig davon, das hier ist nur die schnelle
    // Nutzer-Rückmeldung, kein Sicherheitsmechanismus.
    var rateEntry = ensurePlateLoaded(norm, rateCtx.country);
    var blocked = rateEntry.loaded && ((rateEntry.visible && rateEntry.moderationBlocked) || rateEntry.reason === "blocked");
    if (blocked) {
      return '<div class="stack">' +
        '<h1>'+plateChip(rateCtx.display, null, rateCtx.country)+'</h1>' +
        '<div class="callout warn" style="text-align:left;">Dieses Kennzeichen ist von der Moderation gesperrt (bestätigter Verstoß) und kann aktuell nicht bewertet werden.</div>' +
        '<a class="btn btn-secondary" href="#/search">Zurück zur Suche</a>' +
      '</div>';
    }

    var step = rateCtx.step;
    var stepsHtml = '<div class="steps">' + [1,2,3].map(function(i){ return '<span class="seg '+(i<=step?"done":"")+'"></span>'; }).join("") + '</div>';

    // Kategorie-Auswahl zeigt jetzt ALLE Typen gemischt gruppiert (statt vorher: erst Typ wählen,
    // dann nur Kategorien dieses einen Typs) — auf Nutzerwunsch, damit sich z. B. eine positive und
    // eine negative Beobachtung derselben Situation gemeinsam anhaken lassen. Der bisherige separate
    // Typ-Auswahlschritt entfällt dadurch (war Schritt 2, jetzt direkt Kategorien = Schritt 2).
    if (step === 2) {
      var keys3 = rateCtx.categoryKeys || [];
      var groupsHtml = ["positiv","neutral","negativ"].map(function(t){
        var catsOfType = CATEGORIES.filter(function(c){ return c.type===t; });
        return '<div class="stack" style="gap:var(--sp-2);">' +
          '<p class="eyebrow" style="margin:0;"><span class="chip '+typeChipClass(t)+'">'+typeLabel(t)+'</span></p>' +
          '<div class="cat-grid">' + catsOfType.map(function(c){
            var isSel = keys3.indexOf(c.key) !== -1;
            return '<button class="cat-card'+(isSel?" selected type-"+c.type:"")+'" data-cat="'+c.key+'" aria-pressed="'+isSel+'">' +
              '<span class="cat-label">'+(isSel?"✓ ":"")+esc(c.label)+'</span>' +
              (c.sensitive ? '<span class="cat-level">Sensible Kategorie · Stufe '+c.level+'</span>' : (c.level? '<span class="cat-level">Stufe '+c.level+'</span>' : '<span class="cat-level">&nbsp;</span>')) +
            '</button>';
          }).join("") + '</div>' +
        '</div>';
      }).join("");
      return '<div class="stack">' + stepsHtml +
        '<h1>'+plateChip(rateCtx.display, null, rateCtx.country)+'</h1>' +
        '<div class="callout warn" style="border-color:var(--accent); background:var(--accent-soft); color:var(--accent-strong);">Bewerte nur, was du selbst beobachtet hast. Du kannst mehrere Kategorien anhaken — auch positiv und negativ gemischt, wenn du beides an derselben Situation beobachtet hast.</div>' +
        groupsHtml +
        (keys3.length ? '<div class="callout">' + keys3.map(function(k){ return '<strong>'+esc(catByKey[k].label)+':</strong> '+esc(catByKey[k].def); }).join('<hr class="hair" style="margin:var(--sp-2) 0;"/>') + '</div>' : "") +
        '<div class="row" style="justify-content:space-between;">' +
          '<button class="btn btn-secondary" id="btn-rate-back">Zurück</button>' +
          '<button class="btn btn-primary" id="btn-rate-next" '+(keys3.length?"":"disabled")+'>Weiter'+(keys3.length>1?" ("+keys3.length+")":"")+'</button>' +
        '</div>' +
      '</div>';
    }

    if (step === 3) {
      var keys4 = rateCtx.categoryKeys || [];
      var cats4 = keys4.map(function(k){ return catByKey[k]; });
      return '<div class="stack">' + stepsHtml +
        '<h1>'+plateChip(rateCtx.display, null, rateCtx.country)+'</h1>' +
        '<div class="card stack">' +
          cats4.map(function(cat){
            return '<div class="stack" style="gap:4px;"><div class="row"><span class="chip '+typeChipClass(cat.type)+'">'+typeLabel(cat.type)+'</span><strong>'+esc(cat.label)+'</strong></div>' +
              '<p style="color:var(--ink-muted); margin:0;">'+esc(cat.def)+'</p></div>';
          }).join('<hr class="hair" style="margin:var(--sp-3) 0;"/>') +
          '<hr class="hair" style="margin:var(--sp-3) 0;"/>' +
          '<label class="row" style="align-items:flex-start; gap:var(--sp-3); cursor:pointer;">' +
            '<input type="checkbox" id="chk-not-driving"/>' +
            '<span>Ich bestätige, dass ich diese Bewertung nicht während der Fahrt abgebe.</span>' +
          '</label>' +
        '</div>' +
        '<div class="row" style="justify-content:space-between;">' +
          '<button class="btn btn-secondary" id="btn-rate-back">Zurück</button>' +
          '<button class="btn btn-primary" id="btn-rate-submit">Absenden'+(keys4.length>1?" ("+keys4.length+")":"")+'</button>' +
        '</div>' +
      '</div>';
    }
  }

  function viewConfirmed(){
    var r = lastSubmitResult;
    var n = r ? r.accepted.length : 1;
    var title = n>1 ? "Danke für deine "+n+" Beobachtungen" : "Danke für deine Beobachtung";
    var acceptedList = (r && r.accepted.length)
      ? '<p style="color:var(--ink-muted); margin:0 0 var(--sp-2);">Gespeichert: '+r.accepted.map(function(k){ return esc(catByKey[k].label); }).join(", ")+'</p>'
      : "";
    var skippedNote = (r && r.skipped.length)
      ? '<div class="callout warn" style="text-align:left;">Nicht gespeichert (in den letzten 30 Tagen für dieses Kennzeichen schon vergeben): '+r.skipped.map(function(k){ return esc(catByKey[k].label); }).join(", ")+'</div>'
      : "";
    return '<div class="stack">' +
      '<div class="card stack" style="text-align:center; padding:var(--sp-7) var(--sp-5);">' +
        '<div style="font-size:40px;">✓</div>' +
        '<h1>'+title+'</h1>' +
        acceptedList +
        '<p style="color:var(--ink-muted);">Deine Bewertung wurde gespeichert und fließt — je nach Sichtbarkeit des Kennzeichens — in den RoadScore ein.</p>' +
        skippedNote +
        '<div class="callout" style="text-align:left;">Du kannst dasselbe Kennzeichen frühestens in <strong>24 Stunden</strong> erneut bewerten. Dieselbe Kategorie für dieses Kennzeichen erst wieder nach <strong>30 Tagen</strong>.</div>' +
        '<div class="row" style="justify-content:center; gap:var(--sp-3);">' +
          '<a class="btn btn-secondary" href="#/search">Neue Suche</a>' +
          '<a class="btn btn-primary" href="#/result/'+encodeURIComponent(rateCtx.display)+'">Profil öffnen</a>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  /* ---------- View: Mein Kennzeichen ---------- */
  function viewMyPlate(){
    var params = new URLSearchParams(location.hash.split("?")[1]||"");
    var claimPrefill = params.get("claim") || "";
    var mine = state.currentUser.myPlateKey;

    if (mine) {
      var entry = ensurePlateLoaded(mine, state.currentUser.myPlateCountry);
      if (!entry.loaded) {
        return '<div class="stack"><h1>Mein Kennzeichen</h1><div class="card stack"><p style="color:var(--ink-muted)">Lade Profil …</p></div></div>';
      }
      if (!entry.visible) {
        // Kann bei einer Race zwischen zwei Sitzungen desselben Kontos vorkommen (z. B. gerade in einem
        // anderen Tab abgegeben) - kein Crash, sondern ein Hinweis statt einer falschen Ansicht.
        return '<div class="stack"><h1>Mein Kennzeichen</h1>' +
          '<div class="callout warn">Profil konnte nicht geladen werden (evtl. gerade freigegeben oder in Bearbeitung).</div></div>';
      }
      return '<div class="stack">' +
        '<h1>Mein Kennzeichen</h1>' +
        moderationStatusBanner(entry) +
        renderProfile({ norm: mine, display: entry.display, country: entry.country||"DE", agg: entry.agg, visibility: "private", isOwner: true, publicOptIn: entry.publicOptIn }) +
        renderFriendsCard() +
        '<div class="callout" style="text-align:left;">Fahrzeug verkauft oder Kennzeichen abgegeben? Erst wenn du die Verifizierung freigibst, kann jemand anderes dieses Kennzeichen für sich beanspruchen.</div>' +
        '<button class="btn btn-ghost btn-sm" id="btn-unclaim">Fahrzeug verkauft / Kennzeichen abgeben</button>' +
      '</div>';
    }

    // Ein Claim-Versuch ist an einem bereits fremdverifizierten Kennzeichen gescheitert (jedes
    // Kennzeichen kann immer nur von einem Konto verifiziert sein) — Status + Übernahmeweg statt
    // nur einer Fehlermeldung, weil ein echter Halterwechsel (Verkauf, Ummeldung) vorkommen kann.
    // Übernahme-Anfrage/-Abschluss (transferRequest) ist weiterhin eine reine lokale Simulation
    // (Phase 6.8 steht noch aus) - der Remote-Fetch hier lädt nur die Basisdaten, damit getPlate(b.norm)
    // in den bestehenden Transfer-Handlern unten ein echtes Objekt statt undefined vorfindet.
    if (claimCtx.blocked) {
      var b = claimCtx.blocked;
      var bp = ensurePlateLoaded(b.norm, b.country);
      if (!bp.loaded) {
        return '<div class="stack"><h1>Mein Kennzeichen</h1><div class="card stack"><p style="color:var(--ink-muted)">Lade …</p></div></div>';
      }
      var tr = bp.transferRequest;
      var pendingBySelf = tr && tr.by === state.currentUser.id;
      return '<div class="stack">' +
        '<h1>Mein Kennzeichen</h1>' +
        '<div class="card stack">' +
          '<div>'+plateChip(b.display, null, b.country)+'</div>' +
          (pendingBySelf
            ? '<div class="callout warn" style="text-align:left;">Übernahme beantragt am '+fmtDate(tr.requestedAt)+'. Die aktuell verifizierte Person kann bis <strong>'+fmtDate(tr.deadlineAt)+'</strong> widersprechen — danach geht die Verifizierung automatisch auf dein Konto über.</div>' +
              '<div class="row" style="gap:var(--sp-3); flex-wrap:wrap;">' +
                '<button class="btn btn-secondary btn-sm" id="btn-transfer-cancel">Anfrage zurückziehen</button>' +
                '<button class="btn btn-primary btn-sm" id="btn-transfer-finish">Demo: Frist überspringen &amp; jetzt übernehmen</button>' +
              '</div>'
            : '<p style="color:var(--ink-muted); margin:0;">Dieses Kennzeichen ist bereits von einem anderen Konto verifiziert — jedes Kennzeichen kann immer nur einmal verifiziert sein, sonst könnten sich zwei Personen gleichzeitig als Halter ausgeben.</p>' +
              '<p style="color:var(--ink-muted); margin:0;">Gehört es inzwischen wirklich dir (z. B. nach einem Fahrzeugkauf), kannst du eine Übernahme beantragen. Im echten System würde das einen Belegabgleich (Zulassungsbescheinigung) plus eine Widerspruchsfrist für die Gegenseite auslösen — hier nur simuliert.</p>' +
              '<label class="row" style="align-items:flex-start; gap:var(--sp-3); cursor:pointer;">' +
                '<input type="checkbox" id="chk-fahrzeugschein-transfer"/>' +
                '<span style="font-size:var(--fs-sm);">Ich bestätige, dass ich eine gültige Zulassungsbescheinigung Teil I (Fahrzeugschein) für dieses Kennzeichen besitze. (Demo: wird hier nicht wirklich geprüft.)</span>' +
              '</label>' +
              '<button class="btn btn-primary btn-sm" id="btn-transfer-request" disabled>Übernahme beantragen</button>'
          ) +
          '<button class="btn btn-ghost btn-sm" id="btn-claim-cancel">Anderes Kennzeichen versuchen</button>' +
        '</div>' +
      '</div>';
    }

    return '<div class="stack">' +
      '<h1>Mein Kennzeichen</h1>' +
      '<div class="card stack">' +
        '<p style="color:var(--ink-muted)">Verifiziere dein Kennzeichen, um dein privates Profil zu sehen. Echte Verifizierung würde eine hochgeladene Zulassungsbescheinigung Teil I (Fahrzeugschein) plus Prüfung erfordern, damit sich niemand ein fremdes Kennzeichen erschleichen kann — jedes Kennzeichen kann ohnehin nur von einem Konto gleichzeitig verifiziert sein.</p>' +
        '<div>' +
          '<label class="field-label" for="claim-input">Kennzeichen</label>' +
          '<div class="plate-input-shell">' +
            plateBandAuto("claim-input-band") +
            '<input id="claim-input" type="text" value="'+esc(claimPrefill)+'" placeholder="z. B. M RX 1234" autocomplete="off" maxlength="14" aria-describedby="claim-input-band claim-input-hint" />' +
          '</div>' +
          '<p class="ambig-hint" id="claim-input-hint" role="status"></p>' +
        '</div>' +
        '<label class="row" style="align-items:flex-start; gap:var(--sp-3); cursor:pointer;">' +
          '<input type="checkbox" id="chk-fahrzeugschein"/>' +
          '<span style="font-size:var(--fs-sm);">Ich bestätige, dass ich eine gültige Zulassungsbescheinigung Teil I (Fahrzeugschein) für dieses Kennzeichen besitze und im echten System hochladen würde. (Demo: wird hier nicht wirklich hochgeladen oder geprüft.)</span>' +
        '</label>' +
        '<button class="btn btn-primary btn-block" id="btn-claim" disabled>Als meins verifizieren (Demo)</button>' +
        '<p style="font-size:var(--fs-2xs); color:var(--ink-faint); margin:0;">Verifizierung legt das Kennzeichen in der echten Datenbank an, falls es dort noch nicht existiert.</p>' +
      '</div>' +
    '</div>';
  }

  // Freundesliste: gegenseitige, freiwillige Freigabe zwischen zwei verifizierten Kennzeichen.
  // Bewusst OHNE Benachrichtigung bei Entfernen und mit stiller Rücknahme jederzeit — ein
  // "X hat dich entfernt"-Hinweis würde genau den Kontroll-/Rechtfertigungsdruck erzeugen, den
  // dieses Feature vermeiden soll (siehe Coercive-Control-Risiko bei Freunde-sehen-Standort-Apps).
  //
  // Verbindung läuft über einen Einladungslink (#/friend-invite/:uuid, siehe viewFriendInvite()),
  // NICHT mehr über Kennzeichen-Eingabe: eine Tippfeld-Suche hätte bedeutet, dass man mit einem
  // beliebigen Kennzeichen die dahinterliegende User-ID aufdecken kann, ohne dass die Gegenseite
  // jemals zugestimmt hat, überhaupt auffindbar zu sein — genau die Art Entdeckbarkeit, die das
  // private-by-default-Modell verhindern soll. Der Link macht daraus eine bewusste, von der
  // einladenden Person selbst initiierte Weitergabe (Plan-Entscheidung dieser Session).
  function incomingFriendRequests(){
    var myId = state.currentUser.id;
    var links = state.friendLinks || [];
    return links.filter(function(l){
      if (l.to !== myId || !l.consentedAt) return false;
      var mutual = links.some(function(x){ return x.from===myId && x.to===l.from && x.consentedAt; });
      return !mutual;
    });
  }

  function renderFriendsCard(){
    var myId = state.currentUser.id;
    var links = state.friendLinks || [];
    var outgoing = links.filter(function(l){ return l.from===myId; });
    var incoming = incomingFriendRequests();

    var rows = outgoing.map(function(l){
      var preview = ensureUserPreviewLoaded(l.to);
      var found = preview.loaded && preview.found;
      var label = found ? preview.display : (preview.loaded ? "Kennzeichen nicht mehr auffindbar" : "Lädt …");
      var country = found ? preview.country : "DE";
      var mutual = isMutualFriend(l.to);
      var statusChip = mutual
        ? '<span class="chip chip-positive">'+icon("friend")+' Gegenseitig</span>'
        : '<span class="chip chip-muted">Wartet auf Bestätigung</span>';
      var openLink = mutual && found
        ? '<a class="btn btn-ghost btn-sm" href="#/result/'+encodeURIComponent(preview.display)+'">Profil ansehen</a>'
        : "";
      return '<div class="row" style="justify-content:space-between; align-items:center; flex-wrap:wrap; gap:var(--sp-3);">' +
        '<div class="row" style="gap:var(--sp-3); align-items:center;">'+plateChip(label,null,country)+statusChip+'</div>' +
        '<div class="row" style="gap:var(--sp-2);">'+openLink+
          '<button class="btn btn-ghost btn-sm" data-remove-friend="'+esc(l.to)+'">Entfernen</button>' +
        '</div>' +
      '</div>';
    }).join("");

    var incomingRows = incoming.map(function(l){
      var preview = ensureUserPreviewLoaded(l.from);
      var found = preview.loaded && preview.found;
      var label = found ? preview.display : (preview.loaded ? "Kennzeichen nicht mehr auffindbar" : "Lädt …");
      var country = found ? preview.country : "DE";
      return '<div class="row" style="justify-content:space-between; align-items:center; flex-wrap:wrap; gap:var(--sp-3);">' +
        '<div class="row" style="gap:var(--sp-3); align-items:center;">'+plateChip(label,null,country)+'<span class="chip chip-muted">Möchte sich verbinden</span></div>' +
        '<button class="btn btn-secondary btn-sm" data-connect-incoming="'+esc(l.from)+'" '+(found?"":"disabled")+'>Verbinden</button>' +
      '</div>';
    }).join("");

    var inviteLink = location.origin + location.pathname + "#/friend-invite/" + encodeURIComponent(myId);

    return '<div class="card stack">' +
      '<div class="row" style="justify-content:space-between; align-items:baseline;">' +
        '<p class="eyebrow" style="margin:0;">Freunde</p>' +
        '<button class="btn btn-ghost btn-sm" id="btn-refresh-friends" title="Neue eingehende Anfragen werden nicht automatisch angezeigt — hier manuell nachladen.">Aktualisieren</button>' +
      '</div>' +
      '<p style="color:var(--ink-muted); margin:0;">Teile dein privates Profil gegenseitig mit Personen, die du kennst — ohne es öffentlich zu machen. Die Freigabe gilt erst, wenn ihr euch <strong>beide</strong> gegenseitig hinzufügt, und lässt sich jederzeit lautlos wieder entfernen — die Gegenseite bekommt davon keine Benachrichtigung.</p>' +
      (rows || '<p style="color:var(--ink-faint); font-size:var(--fs-2xs); margin:0;">Noch niemand hinzugefügt.</p>') +
      (incomingRows ? '<div class="stack" style="gap:var(--sp-2);"><p class="eyebrow" style="margin:0;">Eingehende Anfragen</p>' + incomingRows + '</div>' : "") +
      '<div>' +
        '<label class="field-label" for="invite-link-field">Dein Einladungslink</label>' +
        '<div class="row" style="gap:var(--sp-2);">' +
          '<input id="invite-link-field" type="text" readonly value="'+esc(inviteLink)+'" style="flex:1;" />' +
          '<button class="btn btn-secondary btn-sm" id="btn-copy-invite">Kopieren</button>' +
        '</div>' +
        '<p style="font-size:var(--fs-2xs); color:var(--ink-faint); margin:var(--sp-2) 0 0;">Teile diesen Link (z. B. per WhatsApp) mit jemandem, den du kennst. Öffnet die Gegenseite ihn, sieht sie dein Kennzeichen und kann zustimmen — gegenseitig wird es erst, wenn ihr das beide tut.</p>' +
      '</div>' +
    '</div>';
  }

  /* ---------- View: Einladungslink (§8.8 der Spec, Phase 6.4) ---------- */
  function viewFriendInvite(inviterUuid){
    if (!inviterUuid) {
      return '<div class="stack"><h1>Einladungslink</h1>' +
        '<div class="callout warn">Ungültiger Einladungslink.</div>' +
        '<a class="btn btn-secondary" href="#/search">Zur Suche</a></div>';
    }
    var myId = state.currentUser.id;
    if (inviterUuid === myId) {
      return '<div class="stack"><h1>Einladungslink</h1>' +
        '<div class="callout">Das ist dein eigener Einladungslink — teile ihn mit jemand anderem, nicht mit dir selbst.</div>' +
        '<a class="btn btn-secondary" href="#/myplate">Zu Mein Kennzeichen</a></div>';
    }
    var already = (state.friendLinks||[]).some(function(l){ return l.from===myId && l.to===inviterUuid && l.consentedAt; });
    if (already) {
      return '<div class="stack"><h1>Einladungslink</h1>' +
        '<div class="callout">Du hast dieser Verbindung bereits zugestimmt.</div>' +
        '<a class="btn btn-secondary" href="#/myplate">Zu Mein Kennzeichen</a></div>';

    var preview = ensureUserPreviewLoaded(inviterUuid);
    if (!preview.loaded) {
      return '<div class="stack"><h1>Einladungslink</h1><div class="card stack"><p style="color:var(--ink-muted)">Lade …</p></div></div>';
    }
    if (!preview.found) {
      return '<div class="stack"><h1>Einladungslink</h1>' +
        '<div class="callout warn">Diese Person hat noch kein Kennzeichen verifiziert — der Link funktioniert erst danach.</div>' +
        '<a class="btn btn-secondary" href="#/search">Zur Suche</a></div>';
    }
    return '<div class="stack">' +
      '<h1>Einladung zur gegenseitigen Verbindung</h1>' +
      '<div class="card stack">' +
        '<p style="color:var(--ink-muted); margin:0;">Jemand möchte sich mit dir verbinden:</p>' +
        plateChip(preview.display, null, preview.country) +
        '<p style="color:var(--ink-muted); margin:0;">Die Verbindung wird erst gegenseitig sichtbar, wenn ihr euch <strong>beide</strong> hinzufügt — dein Klick hier ist erst die eine Seite davon.</p>' +
        '<button class="btn btn-primary" id="btn-invite-connect" data-inviter="'+esc(inviterUuid)+'">Verbinden</button>' +
      '</div>' +
    '</div>';
  }
